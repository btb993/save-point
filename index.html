<!doctype html>
<html lang="en" data-ver="2.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Save Point</title>
<meta name="description" content="Your game log: what you're playing, have finished and still mean to play.">
<meta name="theme-color" content="#151B27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Save Point">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Silkscreen&family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;700;800&family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: a player card header (level, XP, streak, yearly goal) beside sync and settings buttons;
   a "Now playing" console with big cards and quick session logging; the game rack (three lit shelves
   of boxed spines capped in platform colours, pixel sparks drifting over them, lit by a chosen lamp);
   the search console with Steam import; then Library, Stats and Up next. Rack and console stay dark. */
:root{
  color-scheme:light;
  --bg:#E6EAF1; --panel:#F8FAFC; --ink:#131925; --muted:#586276; --line:#C8D0DD;
  --accent:#2343C4; --accent-ink:#FFFFFF; --accent-soft:#DCE2FA;
  --hot:#E2602A; --good:#24804D; --star:#D99A12;
  --rack:#1A2130; --rack2:#10151F; --slot:#090D14;
  --deck-ink:#E9EDF6; --deck-muted:#94A0BA; --deck-line:#2A3448;
  --lamp:122,150,255; --lamp2:255,140,90;
  --c1:#3B4C8F; --c2:#8A3B3B; --c3:#2F6E62; --c4:#7A5A1E; --c5:#5E3F80; --c6:#2C5D86; --c7:#7F4A63; --c8:#4F6430;
  --p-ps:#2F5BD3; --p-xb:#2E8A3E; --p-ns:#D8352A; --p-pc:#6B7484; --p-mo:#8A4FC2; --p-ot:#9A8A62;
  --shadow:0 1px 2px rgba(20,30,50,.08),0 8px 22px rgba(20,30,50,.10);
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-pixel:"Silkscreen","Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1119; --panel:#151B26; --ink:#E5E9F0; --muted:#8E99AC; --line:#262F42;
  --accent:#8199FF; --accent-ink:#0D1119; --accent-soft:#1F2948;
  --hot:#FF8A55; --good:#5CC48A; --star:#F2BE45;
  --rack:#151B27; --rack2:#0B1018; --slot:#06090E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1119; --panel:#151B26; --ink:#E5E9F0; --muted:#8E99AC; --line:#262F42;
  --accent:#8199FF; --accent-ink:#0D1119; --accent-soft:#1F2948;
  --hot:#FF8A55; --good:#5CC48A; --star:#F2BE45;
  --rack:#151B27; --rack2:#0B1018; --slot:#06090E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark}
:root[data-lamp="sunset"]{--lamp:255,150,80;--lamp2:255,90,130}
:root[data-lamp="neon"]{--lamp:255,80,210;--lamp2:60,230,255}
:root[data-lamp="forest"]{--lamp:110,220,150;--lamp2:240,205,95}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.5;
  background-image:radial-gradient(ellipse 80% 420px at 50% -60px,rgba(var(--lamp),.18),transparent 70%);background-repeat:no-repeat;
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(40px,7.5vw,68px);line-height:.9;text-transform:uppercase;font-style:italic;letter-spacing:-.02em}
h1 .hi{color:var(--hot);text-shadow:0 0 22px color-mix(in srgb,var(--hot) 45%,transparent)}
h2{font-size:26px}
h3{font-size:18.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.px{font-family:var(--f-pixel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hp{display:flex;align-items:center;gap:5px}
.hp i{display:block;width:14px;height:12px;background:var(--hot);clip-path:polygon(20% 0,40% 0,50% 15%,60% 0,80% 0,100% 20%,100% 45%,50% 100%,0 45%,0 20%)}
.hp i.off{background:var(--line)}
.tb{display:flex;gap:8px}
.ibtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;box-shadow:var(--shadow)}
.ibtn:hover{border-color:var(--muted)}
.ibtn .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.ibtn .dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
.ibtn .dot.busy{background:var(--accent);animation:blink 1s infinite}
.ibtn .dot.warn{background:var(--hot)}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 24px}
header .l{display:flex;flex-direction:column;gap:8px;min-width:0}
header .sub{color:var(--muted);max-width:52ch}

/* player card */
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);min-width:min(100%,380px)}
.lvl{grid-row:span 2;display:grid;place-items:center;width:58px;height:58px;border-radius:12px;background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--hot)));color:#fff;font-family:var(--f-display);font-weight:700;line-height:1;text-align:center}
.lvl small{display:block;font-family:var(--f-pixel);font-size:8.5px;letter-spacing:.08em;opacity:.85}
.lvl b{font-size:26px}
.xp{display:flex;flex-direction:column;gap:4px;min-width:0}
.xpbar{height:10px;border-radius:2px;background:var(--bg);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.xpbar span{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,color-mix(in srgb,var(--accent) 80%,#fff) 10px 12px);transition:width .6s}
.pstats{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 10px}
.pstats .fire{color:var(--hot);font-weight:700}
.goal{grid-row:span 2;position:relative;width:58px;height:58px;border:0;background:none;padding:0;cursor:pointer}
.goal svg{width:58px;height:58px;transform:rotate(-90deg)}
.goal .gv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
.goal .gv small{display:block;font-family:var(--f-pixel);font-size:7px;color:var(--muted);font-weight:400;margin-top:2px}
.goal circle{fill:none;stroke-width:6}
.goal .tr{stroke:var(--line)}
.goal .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .8s}

/* ---------- now playing ---------- */
.deck{position:relative;border-radius:18px;padding:18px;background:linear-gradient(180deg,var(--rack),var(--rack2));color:var(--deck-ink);box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
.deck::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 120% at 0% 0%,rgba(var(--lamp2),.22),transparent 60%),radial-gradient(ellipse 50% 100% at 100% 100%,rgba(var(--lamp),.14),transparent 60%);pointer-events:none}
.deckhead{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.deckhead h2{font-size:22px;text-transform:uppercase;font-style:italic;color:#fff}
.deckhead .px{color:var(--deck-muted)}
.live{display:inline-flex;align-items:center;gap:8px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:rgb(var(--lamp2));box-shadow:0 0 10px rgb(var(--lamp2));animation:blink 1.6s ease-in-out infinite}
.npgrid{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.np{position:relative;display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--deck-line);overflow:hidden;isolation:isolate}
.np{min-height:176px}
.np .bgart{position:absolute;inset:0;z-index:-2;background:var(--c);overflow:hidden}
.np .bgart img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%;transition:transform 1.2s ease}
.np:hover .bgart img{transform:scale(1.04)}
.np.blur .bgart{inset:-24px;filter:blur(28px) saturate(1.3);opacity:.5}
.np .shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,11,18,.94) 0%,rgba(8,11,18,.80) 45%,rgba(8,11,18,.35) 100%)}
.np .logo{display:none;max-width:min(260px,100%);max-height:66px;object-fit:contain;object-position:left center;filter:drop-shadow(0 2px 10px rgba(0,0,0,.7))}
.np.haslogo .logo{display:block}
.np.haslogo .tt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.np .box{--fs:13px;cursor:pointer;border:0;padding:0}
.np .body{min-width:0;display:flex;flex-direction:column;gap:7px}
.np .t{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.08;color:#fff;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.np .t:hover{text-decoration:underline;text-underline-offset:3px}
.np .sub{font-size:14px;color:var(--deck-muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.segs i{height:12px;border-radius:2px;background:rgba(255,255,255,.08)}
.segs i.on{background:linear-gradient(180deg,#7CF0A8,#2EB872);box-shadow:0 0 8px rgba(80,220,140,.45)}
.segs i.part{background:linear-gradient(90deg,#3FC982 var(--p),rgba(255,255,255,.08) var(--p))}
.prog{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--deck-muted);font-variant-numeric:tabular-nums}
.prog b{color:#fff;font-weight:700}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.qbtn{border:1px solid var(--deck-line);background:rgba(255,255,255,.06);color:var(--deck-ink);border-radius:8px;padding:5px 11px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;transition:background .15s,transform .1s}
.qbtn:hover{background:rgba(255,255,255,.14)}
.qbtn:active{transform:scale(.96)}
.qbtn.win{border-color:#3FC982;color:#7CF0A8}
.qbtn.win:hover{background:rgba(63,201,130,.16)}
.plus{position:fixed;pointer-events:none;font-family:var(--f-pixel);font-size:14px;color:#7CF0A8;text-shadow:0 0 8px rgba(80,220,140,.8);animation:floatup 1s ease-out forwards;z-index:60}
@keyframes floatup{to{transform:translateY(-34px);opacity:0}}
@media (max-width:520px){.np{grid-template-columns:84px minmax(0,1fr);gap:12px}.np .t{font-size:19px}}

/* ---------- rack ---------- */
.rack{position:relative;border-radius:16px;padding:16px 14px 14px;background:linear-gradient(180deg,var(--rack),var(--rack2));box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
.rack::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.row{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:stretch}
.row + .row{margin-top:12px}
.rowlabel{display:flex;flex-direction:column;justify-content:end;gap:3px;padding:6px 0 10px;color:var(--deck-ink)}
.rowlabel .px{color:var(--deck-muted)}
.rowlabel b{font-family:var(--f-display);font-size:18px;line-height:1.1;color:#fff}
.rowlabel .n{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.rowlabel .spin{margin-top:6px;align-self:start;border:1px solid var(--deck-line);background:rgba(255,255,255,.06);color:var(--deck-ink);border-radius:8px;padding:3px 9px;font-family:var(--f-pixel);font-size:10px;cursor:pointer}
.rowlabel .spin:hover{background:rgba(255,255,255,.14)}
.slot{position:relative;background:radial-gradient(ellipse at 50% 125%,rgba(var(--rl,var(--lamp)),.24),transparent 70%),var(--slot);border-radius:7px;box-shadow:inset 0 10px 16px rgba(0,0,0,.6);overflow:hidden}
.slot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,rgba(var(--rl,var(--lamp)),.7),transparent)}
.row.playing{--rl:var(--lamp2)}
.row.finished{--rl:90,220,150}
.spines{display:flex;align-items:flex-end;gap:3px;height:176px;overflow-x:auto;overflow-y:hidden;padding:16px 10px 3px;scrollbar-width:thin;scrollbar-color:#333c52 transparent}
.spine{flex:0 0 auto;position:relative;width:34px;height:150px;border:0;padding:0;cursor:pointer;border-radius:3px 3px 1px 1px;background:var(--c,var(--c1));color:#F3F5FA;
  background-image:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.16) 18%,rgba(255,255,255,.02) 40%,rgba(0,0,0,.05) 70%,rgba(0,0,0,.38));
  display:flex;flex-direction:column;align-items:center;transition:transform .22s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.spine:hover,.spine:focus-visible{transform:translateY(-10px);box-shadow:0 0 18px rgba(var(--lamp),.55)}
.spine .band{width:100%;height:20px;background:var(--pc,var(--p-ot));border-radius:3px 3px 0 0;display:flex;align-items:center;justify-content:center;font-family:var(--f-pixel);font-size:7.5px;font-style:normal;color:#fff;overflow:hidden;white-space:nowrap;box-shadow:inset 0 -1px 0 rgba(0,0,0,.3)}
.spine span{flex:1;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-display);font-weight:600;font-size:13px;line-height:1;padding:6px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-height:118px}
.spine .pip{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:rgb(var(--lamp2));box-shadow:0 0 8px rgb(var(--lamp2));animation:blink 1.6s ease-in-out infinite}
.spine .cr{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:8px;color:#FFD86B;letter-spacing:-1px;font-style:normal}
@keyframes blink{50%{opacity:.35}}
.spine.ghost{opacity:.14;pointer-events:none}
.spine .band{position:relative;z-index:2}
.spine span{position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.spine .sbg{position:absolute;inset:20px 0 0;overflow:hidden;z-index:0;border-radius:0 0 1px 1px}
.spine .sbg img{width:100%;height:100%;object-fit:cover;transform:scale(1.6);filter:blur(5px) saturate(1.25) brightness(.62)}
.spine .sbg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.12) 22%,transparent 45%,rgba(0,0,0,.4))}
.spine .slogo{position:absolute;left:50%;top:calc(50% + 10px);width:112px;height:28px;transform:translate(-50%,-50%) rotate(-90deg);display:flex;align-items:center;justify-content:center;z-index:1;pointer-events:none}
.spine .slogo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 1px rgba(0,0,0,.9)) drop-shadow(0 0 3px rgba(255,255,255,.35))}
.spine.haslogo span{visibility:hidden}
.spine .slogo img.inv,.np .logo.inv{filter:invert(1) drop-shadow(0 0 2px rgba(0,0,0,.6))}
@media (max-width:560px){.spine .slogo{width:90px;height:24px}}
.emptyrow{align-self:center;color:#AEB8CE;font-style:italic;padding:0 14px;white-space:nowrap;margin-bottom:60px}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr);gap:4px}.rowlabel{flex-direction:row;align-items:baseline;gap:8px;padding:0 2px}.rowlabel .n{font-size:18px}.rowlabel>.px{display:none}.rowlabel .spin{margin:0 0 0 auto}.spines{height:150px}.spine{height:126px;width:30px}.spine span{max-height:96px}}

/* ---------- console (search) ---------- */
.console{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.console form{display:flex;gap:8px;flex-wrap:wrap}
.console input[type=search]{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px;font-size:17px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 16px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15.5px;letter-spacing:.02em;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--hot);border-color:var(--hot);background:transparent}
.btn.small{padding:4px 11px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 12px;font-size:15px;cursor:pointer}
.chip:hover,.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.status{color:var(--muted)}
.dots::after{content:"";display:inline-block;width:1.2em;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.reshead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.results{display:grid;gap:10px}
.note{font-size:14.5px;color:var(--muted)}
.cfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center}

/* ---------- box art ---------- */
.box{position:relative;aspect-ratio:3/4;width:100%;max-width:100%;border-radius:4px;overflow:hidden;background:var(--c,var(--c1));color:#F3F5FA;
  box-shadow:0 2px 4px rgba(0,0,0,.18),0 10px 18px rgba(20,30,50,.16)}
.box .band{position:absolute;inset:0 0 auto;height:13%;background:var(--pc,var(--p-ot));display:flex;align-items:center;padding:0 8%;font-family:var(--f-pixel);font-size:calc(var(--fs,14px) * .6);color:#fff;white-space:nowrap;overflow:hidden;z-index:1}
.box .art{position:absolute;inset:13% 0 0;padding:10% 9%;display:flex;flex-direction:column;justify-content:space-between;background-image:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.3))}
.box .emb{position:absolute;right:-12%;bottom:-8%;width:78%;aspect-ratio:1;opacity:.22}
.box .bt{position:relative;font-family:var(--f-display);font-weight:700;font-style:italic;text-transform:uppercase;font-size:var(--fs,14px);line-height:1.02;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.box .bd{position:relative;font-size:calc(var(--fs,14px) * .62);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box img.cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;background:var(--c)}

.vs{display:grid;gap:8px}

.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}

.because{font-size:14.5px;border-left:3px solid var(--hot);padding-left:8px;color:var(--ink)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,9,15,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(640px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:pop .22s cubic-bezier(.3,1.4,.5,1)}

.mhead{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start}
.mhead .box{--fs:12.5px}
.coverctl{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:13.5px}
.coverctl .links{display:flex;flex-wrap:wrap;gap:2px 10px}
.coverctl a{color:var(--accent)}
.drop{border:1.5px dashed var(--accent);border-radius:8px;padding:6px 8px;color:var(--muted);text-align:center;cursor:pointer;background:color-mix(in srgb,var(--accent) 5%,transparent)}
.drop.over{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.field{display:flex;flex-direction:column;gap:3px;min-width:0}

.datepick{display:flex;gap:6px;align-items:center}

.statpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}

.starpick{display:flex;align-items:center;gap:2px}

details.more{border:1px solid var(--line);border-radius:12px;padding:0 12px}

.qadd{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}

/* import */
.imp textarea{width:100%;min-height:130px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}

/* roulette */

.steps{margin:0;padding-left:20px;display:grid;gap:8px}

/* ---------- title screen ---------- */
.hero{--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--ink:#EEF2FA;--muted:#9AA6BF;--bg:rgba(0,0,0,.35);--accent:#8199FF;--accent-soft:#1F2948;--hot:#FF8A55;--good:#5CC48A;
  position:relative;isolation:isolate;overflow:hidden;border-radius:22px;padding:16px 22px 46px;color:var(--ink);display:flex;flex-direction:column;gap:22px;
  background:radial-gradient(ellipse 70% 80% at 50% 108%,rgba(var(--lamp2),.30),transparent 62%),linear-gradient(180deg,#080B14,#121a2b 58%,#0A0E17);
  box-shadow:0 18px 40px rgba(10,14,24,.35),inset 0 0 0 1px rgba(255,255,255,.07)}
.sky{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky::before{content:"";position:absolute;inset:0 0 45% 0;opacity:.8;background-image:
  radial-gradient(1.2px 1.2px at 8% 22%,#fff,transparent),radial-gradient(1px 1px at 18% 64%,#cfe0ff,transparent),radial-gradient(1.4px 1.4px at 27% 12%,#fff,transparent),
  radial-gradient(1px 1px at 39% 40%,#ffd9c7,transparent),radial-gradient(1.2px 1.2px at 52% 18%,#fff,transparent),radial-gradient(1px 1px at 61% 58%,#cfe0ff,transparent),
  radial-gradient(1.5px 1.5px at 73% 26%,#fff,transparent),radial-gradient(1px 1px at 84% 52%,#ffd9c7,transparent),radial-gradient(1.2px 1.2px at 93% 14%,#fff,transparent);
  animation:twinkle 9s ease-in-out infinite alternate;will-change:opacity}

/* the floor only ever slides (a GPU move), slowly, with soft lines, so it stays smooth and easy on the eyes */
.floor{position:absolute;left:-60%;right:-60%;bottom:-4px;height:85%;overflow:hidden;
  transform:perspective(240px) rotateX(64deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 5%,rgba(0,0,0,.5) 40%,transparent 72%);mask-image:linear-gradient(to top,#000 5%,rgba(0,0,0,.5) 40%,transparent 72%)}
.floor .grid{position:absolute;left:0;right:0;top:-60px;bottom:0;
  background-image:linear-gradient(rgba(var(--lamp),.42) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(var(--lamp),.32) 1.5px,transparent 1.5px);background-size:60px 60px;
  animation:gridmove 7s linear infinite;will-change:transform;backface-visibility:hidden}
@keyframes gridmove{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,60px,0)}}
.horizon{position:absolute;left:10%;right:10%;bottom:30%;height:70px;background:radial-gradient(ellipse 50% 100% at 50% 100%,rgba(var(--lamp2),.22),transparent 70%)}
.hero .topbar{position:relative}
.hero .ibtn{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:none}
.hero-main{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 24px}
.titlewrap{display:flex;align-items:center;gap:18px;min-width:0}
.hero .l{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero h1{color:#fff;text-shadow:2px 0 0 rgba(var(--lamp),.55),-2px 0 0 rgba(var(--lamp2),.4),0 0 30px rgba(var(--lamp),.35)}
.hero .sub{color:var(--muted);max-width:52ch}
.hero .pcard{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.crystalwrap{position:relative;flex:0 0 auto;width:72px;height:112px;display:flex;align-items:flex-start}
.cglow{position:absolute;left:50%;top:42%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:radial-gradient(circle,rgba(var(--lamp),.42),rgba(var(--lamp2),.12) 45%,transparent 70%);animation:glow 5s ease-in-out infinite;will-change:opacity}
.cfloat{position:relative;animation:bob 5s ease-in-out infinite;will-change:transform}
.crystal{display:block;width:72px;height:104px;overflow:visible;filter:drop-shadow(0 0 7px rgba(var(--lamp),.75))}
.crystal .orbit{fill:none;stroke:rgb(var(--lamp2));stroke-width:1.3;stroke-dasharray:3 7}
.crystal .orbit.back{stroke-opacity:.35}
.cshadow{position:absolute;left:8px;right:8px;bottom:0;height:12px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(var(--lamp),.6),transparent 70%);animation:cshadow 5s ease-in-out infinite;will-change:transform,opacity}
@keyframes bob{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-7px,0)}}
@keyframes cshadow{50%{transform:scaleX(.72);opacity:.5}}
@keyframes glow{50%{opacity:.55}}
/* banner motion setting, and a full stop while the banner is scrolled out of view */
.hero.still *,.hero.still .sky::before{animation-play-state:paused!important}
:root[data-motion="calm"] .floor .grid{animation-duration:18s}
:root[data-motion="calm"] .cfloat,:root[data-motion="calm"] .cshadow{animation-duration:9s}
:root[data-motion="calm"] .sky::before,:root[data-motion="calm"] .cglow{animation:none}
:root[data-motion="off"] .hero *,:root[data-motion="off"] .hero .sky::before,:root[data-motion="off"] .live::before,:root[data-motion="off"] .spine .pip,:root[data-motion="off"] .tab::before{animation:none!important}
@media (max-width:560px){.hero .hp .px{display:none}.rowlabel{justify-content:flex-start}.hero{padding:14px 16px 34px;border-radius:18px}.crystalwrap{width:50px;height:80px}.crystal{width:50px;height:72px}.cglow{width:96px;height:96px;margin:-48px 0 0 -48px}.titlewrap{gap:12px}.hero .pcard{width:100%}}

/* ---------- moments ---------- */
.ach{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;display:flex;gap:12px;align-items:center;
  background:linear-gradient(180deg,#1B2232,#0F141F);color:#EEF2FA;border:1px solid rgba(var(--lamp2),.6);border-radius:14px;padding:10px 20px 10px 12px;
  box-shadow:0 0 30px rgba(var(--lamp2),.35),0 12px 30px rgba(0,0,0,.4);animation:achin .55s cubic-bezier(.3,1.5,.5,1),achout .4s ease-in 3.8s forwards;max-width:calc(100% - 32px)}
.ach svg{width:42px;height:42px;flex:0 0 auto;filter:drop-shadow(0 0 8px rgba(255,200,80,.6))}
.ach .px{color:rgb(var(--lamp2))}
.ach b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.2}
.ach span{font-size:13.5px;color:#9AA6BF}
@keyframes achin{from{transform:translate(-50%,-140%)}}
@keyframes achout{to{transform:translate(-50%,-160%);opacity:0}}
.lvup{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none;background:radial-gradient(circle,rgba(var(--lamp),.35),transparent 60%);animation:lvfade 2s ease-out forwards}
.lvup .px{display:block;text-align:center;color:#fff;font-size:16px;letter-spacing:.35em}
.lvup b{display:block;font-family:var(--f-display);font-style:italic;font-size:clamp(60px,13vw,120px);line-height:1;color:#fff;text-shadow:0 0 30px rgb(var(--lamp)),0 0 70px rgb(var(--lamp2));animation:lvpop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes lvfade{0%,70%{opacity:1}to{opacity:0}}
@keyframes lvpop{from{transform:scale(.4);opacity:0}}

/* ---------- game window banner ---------- */
.modal.game{padding-top:0}
.mban{position:relative;margin:0 -20px;height:170px;flex:0 0 auto;overflow:hidden;background:var(--c);isolation:isolate}
.mban img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.mban.blur img{filter:blur(22px) saturate(1.3);transform:scale(1.25);opacity:.75}
.mban::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),transparent 40%,var(--panel))}
.mx{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:15px}
.mx:hover{background:rgba(0,0,0,.75)}
.modal.game .mhead{margin-top:-100px;position:relative;z-index:1}
.modal.game .mhead > .meta{padding-top:104px}
@media (max-width:520px){.mban{height:140px}.modal.game .mhead{margin-top:-84px}.modal.game .mhead > .meta{padding-top:88px}}

/* ---------- small delights ---------- */
.tab[aria-selected="true"]::before{content:"";display:inline-block;width:0;height:0;border-left:7px solid var(--hot);border-top:5px solid transparent;border-bottom:5px solid transparent;margin-right:8px;vertical-align:1px;animation:blink 2.4s ease-in-out infinite}
main:not([hidden]){animation:viewin .35s ease-out}
@keyframes viewin{from{opacity:.25;transform:translateY(6px)}}
.game .box::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.42) 50%,transparent 60%);background-size:250% 100%;background-position:130% 0;opacity:0}
.game:hover .box::before{animation:shine .9s ease-out}
@keyframes shine{0%{opacity:1;background-position:130% 0}100%{opacity:1;background-position:-30% 0}}
.kpi{border-top:3px solid rgba(var(--lamp),.65)}

/* ---------- art picker ---------- */
.art-scrim{z-index:30}
.artbtn{justify-content:center;width:100%}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.artgrid.logos{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.arttile{position:relative;border:2px solid var(--line);border-radius:10px;padding:0;background:var(--bg);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;text-align:left;color:var(--ink);transition:transform .15s,border-color .15s}
.arttile:hover{transform:translateY(-2px);border-color:var(--muted)}
.arttile.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.arttile.on::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700;z-index:5}
.arttile > img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--line)}
.arttile .box{border-radius:0;box-shadow:none;--fs:13px}
.arttile > span{font-size:12.5px;color:var(--muted);padding:5px 8px}
.artgrid.logos .arttile > img{aspect-ratio:16/7;object-fit:contain;background:#141A26;padding:12px}
.arttile.plain b{display:grid;place-items:center;aspect-ratio:16/7;background:#141A26;color:#fff;font-family:var(--f-display);font-size:16px;padding:8px;text-align:center}

/* ---------- discover ---------- */
#disc{display:flex;flex-direction:column;gap:30px;margin-top:22px}
.dsec{display:flex;flex-direction:column;gap:12px;min-width:0}
.dsec h2{font-size:22px}
.shelfrow{display:grid;grid-auto-flow:column;grid-auto-columns:148px;gap:16px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.topgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:24px 16px}
@media (max-width:420px){.shelfrow{grid-auto-columns:128px}.topgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dcard{display:flex;flex-direction:column;gap:5px;min-width:0;scroll-snap-align:start}
.dcov{position:relative;border:0;padding:0;background:none;cursor:pointer;perspective:600px}
.dcov .box{--fs:15px;transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s}
.dcov:hover .box,.dcov:focus-visible .box{transform:translateY(-4px) rotateY(-7deg);box-shadow:0 0 0 2px var(--accent),-8px 14px 22px rgba(20,30,50,.25)}
.dcard.have .box{filter:saturate(.55) brightness(.8)}
.drank{position:absolute;left:-6px;top:-8px;z-index:6;min-width:34px;height:34px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:700;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.dhave{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;font-family:var(--f-pixel);font-size:10px;background:var(--good);color:#fff;padding:2px 8px;border-radius:4px;white-space:nowrap}
.dt{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dwhy{font-size:12.5px;color:var(--ink);border-left:2px solid var(--hot);padding-left:6px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dact{display:flex;gap:4px;margin-top:2px}
.dact .btn{padding:3px 8px;font-size:12.5px;white-space:nowrap;flex:0 0 auto}
.dact .btn.primary{flex:1 1 auto;min-width:0;justify-content:center;padding:3px 6px}
.dcard .dm.two{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.dcard.skel .box{background:linear-gradient(100deg,var(--line) 30%,var(--panel) 50%,var(--line) 70%);background-size:300% 100%;animation:skel 1.4s linear infinite;box-shadow:none}
.dcard.skel .box::after{display:none}
.dcard.skel .dt,.dcard.skel .dm{background:var(--line);border-radius:4px;opacity:.6}
@keyframes skel{to{background-position:-150% 0}}

/* ---------- wishlist radar ---------- */
.radarwrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;align-items:center;background:linear-gradient(180deg,var(--rack),var(--rack2));color:var(--deck-ink);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:22px}
.radarwrap .note{color:var(--deck-muted)}
.radarwrap h2{color:#fff;font-size:28px}
.radar{position:relative;width:100%;max-width:320px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(var(--lamp),.14),transparent 70%),#070A12;box-shadow:inset 0 0 0 1px rgba(var(--lamp),.35),0 0 40px rgba(var(--lamp),.15);overflow:hidden}
.radar .ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(var(--lamp),.28);transform:translate(-50%,-50%)}
.radar .r1{width:33%;height:33%}.radar .r2{width:62%;height:62%}.radar .r3{width:92%;height:92%}
.radar::before,.radar::after{content:"";position:absolute;background:rgba(var(--lamp),.18)}
.radar::before{left:50%;top:4%;bottom:4%;width:1px}.radar::after{top:50%;left:4%;right:4%;height:1px}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(var(--lamp),.42),rgba(var(--lamp),0) 70deg,transparent 360deg);animation:sweep 6s linear infinite;will-change:transform}
@keyframes sweep{to{transform:rotate(360deg)}}
.radar .me{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
.blip{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:0;padding:0;cursor:pointer;background:rgb(var(--lamp2));box-shadow:0 0 0 3px rgba(var(--lamp2),.25),0 0 12px rgb(var(--lamp2));z-index:2;transition:transform .15s}
.blip:hover,.blip:focus-visible{transform:scale(1.5)}
.blip.near{animation:blink 1.8s ease-in-out infinite}
.nexttitle{font-family:var(--f-pixel);font-size:11px;color:rgb(var(--lamp2));text-transform:uppercase;letter-spacing:.08em;margin-top:8px}
.bigcount{font-family:var(--f-display);font-size:20px;color:var(--deck-ink);margin:4px 0}
.bigcount b{font-size:56px;line-height:1;color:#fff;text-shadow:0 0 24px rgba(var(--lamp2),.6);font-variant-numeric:tabular-nums}
.radarinfo{display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:640px){.radarwrap{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.radar{max-width:260px}.radarinfo{align-items:center}}
.wlist{display:grid;gap:10px}
.wrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wrow .box{--fs:9px}
.wcount{text-align:center;min-width:64px}
.wcount b{display:block;font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--hot)}
.wcount span{font-size:12.5px;color:var(--muted)}
.wlabel{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--muted)!important}
.wlabel.out{color:var(--good)!important}
.wact{display:flex;flex-direction:column;gap:6px}
@media (max-width:560px){.wrow{grid-template-columns:54px minmax(0,1fr) auto}.wact{grid-column:2/-1;flex-direction:row}}

/* ---------- trophies ---------- */
.trohead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.trogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.trophy{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.trophy.got{box-shadow:inset 0 0 0 1px rgba(var(--lamp2),.25)}
.trophy .tm{display:flex;flex-direction:column;gap:2px;min-width:0}
.trophy b{font-family:var(--f-display);font-size:16px}
.trophy span{font-size:13.5px;color:var(--muted)}
.trophy em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.trophy.got em{color:var(--good)}
.tp{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.tp i{display:block;height:100%;background:var(--accent)}
.tiertitle{font-family:var(--f-pixel);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.tiertitle.platinum{color:#8FB8D8}.tiertitle.gold{color:#D9A21B}.tiertitle.silver{color:#9AA3B2}.tiertitle.bronze{color:#B87333}
.medal{flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.medal .mr{fill:var(--m1)}.medal .mi{fill:var(--m2)}.medal .mg{fill:var(--m3)}
.medal.bronze{--m1:#8A5528;--m2:#C8874A;--m3:#5A3415}
.medal.silver{--m1:#7C8796;--m2:#D3D9E2;--m3:#545E6C}
.medal.gold{--m1:#B98314;--m2:#F2C94C;--m3:#7A5508}
.medal.platinum{--m1:#4E7C9E;--m2:#CFE8F7;--m3:#2E5470}
.medal.locked{--m1:var(--line);--m2:var(--bg);--m3:var(--line);filter:none}

/* ---------- year in review ---------- */
.reviewcta{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 16px;width:100%;margin-bottom:14px;padding:16px 20px;border:0;border-radius:16px;cursor:pointer;text-align:left;color:#fff;
  background:radial-gradient(ellipse at 100% 0%,rgba(var(--lamp2),.55),transparent 60%),linear-gradient(120deg,#1B1F3A,#2A1B3A);box-shadow:var(--shadow)}
.reviewcta .px{color:rgb(var(--lamp2));grid-column:1}
.reviewcta b{font-family:var(--f-display);font-size:22px;grid-column:1}
.reviewcta span:not(.px){color:#B9C0D6;font-size:14px;grid-column:1}
.reviewcta i{grid-column:2;grid-row:1/4;font-style:normal;font-size:26px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.story{position:fixed;inset:0;z-index:80;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  background:radial-gradient(ellipse 80% 60% at 50% 110%,rgba(var(--lamp2),.45),transparent 60%),radial-gradient(ellipse 60% 50% at 10% 0%,rgba(var(--lamp),.4),transparent 60%),#0B0E1A;
  padding:max(50px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(30px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.story .sbar{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:60px;display:flex;gap:4px;z-index:3}
.story .sbar i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.story .sbar i.done,.story .sbar i.on{background:#fff}
.story .mx{top:calc(6px + env(safe-area-inset-top,0px))}
.story .snav{position:absolute;top:0;bottom:0;width:40%;border:0;background:transparent;cursor:pointer;z-index:1}
.story .snav.prev{left:0;cursor:w-resize}.story .snav.next{right:0;width:60%;cursor:e-resize}
.slide{position:relative;z-index:2;pointer-events:none;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:12px}
.slide button,.slide a{pointer-events:auto}
.slide > *{animation:rise .6s cubic-bezier(.2,.9,.3,1) both}
.slide > :nth-child(2){animation-delay:.08s}.slide > :nth-child(3){animation-delay:.16s}.slide > :nth-child(4){animation-delay:.24s}.slide > :nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.slide .px{color:rgb(var(--lamp2));font-size:13px}
.slide p{margin:0;color:#C3C9DC;font-size:18px}
.rbig{font-size:clamp(52px,11vw,96px)!important;line-height:.95;text-transform:uppercase}
.rnum{font-family:var(--f-display);font-weight:700;font-size:clamp(90px,22vw,170px);line-height:.9;background:linear-gradient(180deg,#fff,rgb(var(--lamp)));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.rmid{font-size:clamp(30px,6vw,48px)}
.rcovers{display:flex;justify-content:center;margin-top:10px;flex-wrap:wrap;gap:0}
.rcovers > div{width:84px;margin:0 -10px;transform:rotate(calc((var(--i) - 3.5) * 4deg));animation:rise .6s both;animation-delay:calc(.25s + var(--i) * .06s)}
.rgoty{width:min(220px,55vw);transform:rotate(-3deg);filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.rgoty .box{--fs:20px}
.rstars{font-size:30px}
.rbars{display:flex;gap:6px;align-items:flex-end;height:120px;width:min(420px,80vw)}
.rbars i{flex:1;height:max(4px,var(--h));background:rgba(255,255,255,.25);border-radius:4px 4px 0 0}
.rbars i.on{background:rgb(var(--lamp2));box-shadow:0 0 18px rgba(var(--lamp2),.7)}
.rtro{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:420px}

/* ================= themes ================= */
.qbtn.timer.on{border-color:rgb(var(--lamp2));color:#fff;background:rgba(var(--lamp2),.18);font-variant-numeric:tabular-nums}
.aurora,.peaks,.mist{display:none}
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.skin{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;color:var(--ink)}
.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.skin .sw{height:54px;border-radius:8px;display:grid;place-items:center;font-style:normal;color:#fff;margin-bottom:4px}
.skin strong{font-size:14.5px}
.skin span{font-size:12px;color:var(--muted);line-height:1.3}
.skin.retro .sw{background:linear-gradient(0deg,rgba(122,150,255,.5) 1px,transparent 1px) 0 0/100% 10px,linear-gradient(180deg,#0A0E18,#26203A);font-family:"Chakra Petch";font-style:italic;font-weight:700;font-size:22px}
.skin.modern .sw{background:radial-gradient(circle at 25% 30%,#6E6BFF,transparent 55%),radial-gradient(circle at 80% 70%,#FF5C9A,transparent 55%),#11132A;font-family:Sora;font-weight:800;font-size:22px}
.skin.fantasy .sw{background:linear-gradient(180deg,#0E1230,#2B2140);font-family:Cinzel;font-weight:700;font-size:22px;color:#F2C46A}
@media (max-width:420px){.skins{grid-template-columns:minmax(0,1fr)}.skin{flex-direction:row;align-items:center;gap:10px}.skin .sw{width:64px;flex:0 0 auto;margin:0}}

/* ---------- Modern: a clean console dashboard ---------- */
:root[data-skin="modern"]{--bg:#EEF0F6;--panel:#FFFFFF;--ink:#0E1122;--muted:#5A6077;--line:#DCDFEA;--accent:#5654F0;--accent-ink:#fff;--accent-soft:#E5E4FF;--hot:#EE3F78;--good:#0F9F6A;--star:#F2A516;
  --rack:#14172C;--rack2:#0C0E1E;--slot:rgba(255,255,255,.04);
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;--f-body:"Manrope","Segoe UI",system-ui,sans-serif;--f-pixel:"Manrope","Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,24,60,.06),0 12px 32px rgba(20,24,60,.10)}
@media (prefers-color-scheme:dark){:root[data-skin="modern"]:not([data-theme="light"]){--bg:#090B17;--panel:#121528;--ink:#ECEEF8;--muted:#9096B0;--line:#242842;--accent:#8C8AFF;--accent-ink:#090B17;--accent-soft:#232450;--hot:#FF6E9C;--good:#3DD598;--star:#FFC14A;--rack:#121528;--rack2:#0A0C1A}}
:root[data-skin="modern"][data-theme="dark"]{--bg:#090B17;--panel:#121528;--ink:#ECEEF8;--muted:#9096B0;--line:#242842;--accent:#8C8AFF;--accent-ink:#090B17;--accent-soft:#232450;--hot:#FF6E9C;--good:#3DD598;--star:#FFC14A;--rack:#121528;--rack2:#0A0C1A}
:root[data-skin="modern"] .px{font-weight:800;letter-spacing:.12em;font-size:10.5px}
:root[data-skin="modern"] h1{font-style:normal;text-transform:none;letter-spacing:-.045em;font-weight:800}
:root[data-skin="modern"] .hero h1{text-shadow:none}
:root[data-skin="modern"] .hero h1 .hi{background:linear-gradient(90deg,rgb(var(--lamp)),rgb(var(--lamp2)));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
:root[data-skin="modern"] .hero{background:#0B0D1E;border-radius:28px}
:root[data-skin="modern"] .floor,:root[data-skin="modern"] .horizon,:root[data-skin="modern"] .crystalwrap,:root[data-skin="modern"] .hp{display:none}
:root[data-skin="modern"] .aurora{display:block;position:absolute;inset:0}
.aurora i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;will-change:transform;animation:drift 24s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:55%;height:150%;left:-10%;top:-60%;background:rgb(var(--lamp))}
.aurora i:nth-child(2){width:45%;height:130%;right:-8%;top:-20%;background:rgb(var(--lamp2));animation-duration:30s;animation-delay:-8s}
.aurora i:nth-child(3){width:35%;height:90%;left:35%;bottom:-70%;background:#7B5CFF;opacity:.35;animation-duration:36s;animation-delay:-15s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(12%,10%,0) scale(1.15)}}
:root[data-skin="modern"] .deck,:root[data-skin="modern"] .rack,:root[data-skin="modern"] .radarwrap{border-radius:24px;background:linear-gradient(160deg,#171A33,#0C0E1E)}
:root[data-skin="modern"] .rack::after{display:none}
:root[data-skin="modern"] .slot{border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);background:rgba(255,255,255,.035)}
:root[data-skin="modern"] .slot::after{height:2px;opacity:.6}
:root[data-skin="modern"] .spine{border-radius:6px 6px 3px 3px}
:root[data-skin="modern"] .spine .band{border-radius:6px 6px 0 0}
:root[data-skin="modern"] .box{border-radius:12px}
:root[data-skin="modern"] .box .bt{font-style:normal;text-transform:none;letter-spacing:-.02em}
:root[data-skin="modern"] .btn,:root[data-skin="modern"] .console input[type=search]{border-radius:999px}
:root[data-skin="modern"] .console,:root[data-skin="modern"] .panel,:root[data-skin="modern"] .kpi,:root[data-skin="modern"] .trophy,:root[data-skin="modern"] .wrow{border-radius:20px;border-color:transparent;box-shadow:var(--shadow)}
:root[data-skin="modern"] .tab{text-transform:none;letter-spacing:0;font-weight:700}
:root[data-skin="modern"] .tab[aria-selected="true"]::before{display:none}
:root[data-skin="modern"] .tabs{border-bottom:0;gap:6px}
:root[data-skin="modern"] .tab{border-radius:999px;border-bottom:0;margin:0;padding:8px 18px}
:root[data-skin="modern"] .tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* ---------- Fantasy: night peaks, gold letters, wooden shelves ---------- */
:root[data-skin="fantasy"]{--bg:#EEE5D1;--panel:#FBF6EA;--ink:#2B2117;--muted:#6E5D47;--line:#D9C9A9;--accent:#2E5E52;--accent-ink:#FBF6EA;--accent-soft:#DCE9E2;--hot:#A9452B;--good:#4C7A39;--star:#BE8519;
  --rack:#4A2F1C;--rack2:#2A1A0E;--slot:#160D06;
  --f-display:"Cinzel",Georgia,serif;--f-body:"Spectral",Georgia,serif;--f-pixel:"Cinzel",Georgia,serif;
  --shadow:0 1px 2px rgba(60,40,15,.1),0 10px 26px rgba(60,40,15,.12)}
@media (prefers-color-scheme:dark){:root[data-skin="fantasy"]:not([data-theme="light"]){--bg:#13100C;--panel:#1E1913;--ink:#F0E5CF;--muted:#AA997D;--line:#3A3024;--accent:#8EC0A8;--accent-ink:#13100C;--accent-soft:#22342C;--hot:#E27D55;--good:#8FBC6F;--star:#E8B64A;--rack:#3C2616;--rack2:#21150B}}
:root[data-skin="fantasy"][data-theme="dark"]{--bg:#13100C;--panel:#1E1913;--ink:#F0E5CF;--muted:#AA997D;--line:#3A3024;--accent:#8EC0A8;--accent-ink:#13100C;--accent-soft:#22342C;--hot:#E27D55;--good:#8FBC6F;--star:#E8B64A;--rack:#3C2616;--rack2:#21150B}
:root[data-skin="fantasy"] body{font-size:17.5px}
:root[data-skin="fantasy"] .px{font-weight:700;letter-spacing:.14em;font-size:10.5px}
:root[data-skin="fantasy"] h1{font-style:normal;letter-spacing:.05em;font-weight:700}
:root[data-skin="fantasy"] .hero h1{background:linear-gradient(180deg,#FFF3CF 10%,#E9B85E 55%,#A9711F);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
:root[data-skin="fantasy"] .hero h1 .hi{color:transparent;text-shadow:none}
:root[data-skin="fantasy"] .hero{background:linear-gradient(180deg,#070A1F 0%,#16163A 55%,#2A1E37 100%);box-shadow:0 18px 40px rgba(30,20,10,.35),inset 0 0 0 1px rgba(233,184,94,.25)}
:root[data-skin="fantasy"] .floor,:root[data-skin="fantasy"] .horizon{display:none}
:root[data-skin="fantasy"] .peaks{display:block;position:absolute;left:0;right:0;bottom:0;width:100%;height:55%}
.peaks .far{fill:#241E44;opacity:.9}.peaks .near{fill:#120F24}
:root[data-skin="fantasy"] .mist{display:block;position:absolute;inset:auto 0 0 0;height:50%;overflow:hidden}
.mist i{position:absolute;bottom:-10%;width:70%;height:70%;border-radius:50%;background:radial-gradient(ellipse,rgba(200,190,255,.16),transparent 70%);will-change:transform;animation:mist 40s linear infinite}
.mist i:nth-child(2){animation-duration:55s;animation-delay:-20s;bottom:0;opacity:.7}
@keyframes mist{from{transform:translate3d(-70%,0,0)}to{transform:translate3d(160%,0,0)}}
:root[data-skin="fantasy"] .ibtn,:root[data-skin="fantasy"] .hero .pcard{border-color:rgba(233,184,94,.35)}
:root[data-skin="fantasy"] .lvl{background:linear-gradient(160deg,#E9B85E,#8A5A1C);color:#1B1208}
:root[data-skin="fantasy"] .rack{box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,220,160,.1)}
:root[data-skin="fantasy"] .rack::after{background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 11px),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 7px)}
:root[data-skin="fantasy"] .slot{border-radius:3px;box-shadow:inset 0 12px 18px rgba(0,0,0,.6),inset 0 0 0 6px #3A2414}
:root[data-skin="fantasy"] .slot::after{height:12px;background:linear-gradient(180deg,#8A5D36,#5B3A20);opacity:1;box-shadow:0 -1px 0 rgba(255,220,160,.25)}
:root[data-skin="fantasy"] .spines{padding-bottom:12px}
:root[data-skin="fantasy"] .spine .band{font-family:Cinzel,serif;font-weight:700;font-size:8px}
:root[data-skin="fantasy"] .box .bt{font-style:normal;letter-spacing:.04em}
:root[data-skin="fantasy"] .deck,:root[data-skin="fantasy"] .radarwrap{background:linear-gradient(180deg,#1D1830,#100D1C);box-shadow:var(--shadow),inset 0 0 0 1px rgba(233,184,94,.2)}
:root[data-skin="fantasy"] .console,:root[data-skin="fantasy"] .panel,:root[data-skin="fantasy"] .modal{box-shadow:var(--shadow),inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--line)}
:root[data-skin="fantasy"] .tab{letter-spacing:.1em}
:root[data-skin="fantasy"] .tab[aria-selected="true"]::before{border-left-color:var(--star)}
:root[data-skin="fantasy"] .tab[aria-selected="true"]{border-bottom-color:var(--star)}
:root[data-skin="fantasy"] .btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
:root[data-skin="modern"] .hero .topbar{justify-content:flex-end}
:root[data-skin="modern"] .deckhead h2{font-style:normal;text-transform:none;letter-spacing:-.02em}
:root[data-skin="fantasy"] .deckhead h2{font-style:normal;letter-spacing:.06em;color:#F2D49A}
:root[data-motion="off"] .aurora i,:root[data-motion="off"] .mist i,:root[data-motion="off"] .radar .sweep{animation:none!important}
:root[data-motion="calm"] .aurora i,:root[data-motion="calm"] .mist i{animation-duration:80s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero" aria-label="Player">
    <div class="sky" aria-hidden="true"><div class="floor"><div class="grid"></div></div><i class="horizon"></i>
      <div class="aurora"><i></i><i></i><i></i></div>
      <svg class="peaks" viewBox="0 0 1200 220" preserveAspectRatio="none"><path class="far" d="M0 220V120l90-50 70 40 110-80 90 70 80-30 120 90 100-110 120 80 90-40 110 70 90-50 130 60V220z"/><path class="near" d="M0 220V170l120-40 90 30 140-70 100 60 130-30 90 50 150-90 110 70 120-30 150 60V220z"/></svg>
      <div class="mist"><i></i><i></i></div></div>
    <div class="topbar">
      <div class="hp" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="off"></i><span class="px" style="margin-left:8px">Player 1</span></div>
    <div class="tb">
      <button class="ibtn" type="button" id="sync-btn" aria-label="Sync"><span class="dot" id="sync-dot"></span><span id="sync-label">Sync</span></button>
      <button class="ibtn" type="button" id="install-top" hidden><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1v9m0 0L4.5 6.5M8 10l3.5-3.5M2 12v2h12v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Install app</button>
      <button class="ibtn" type="button" id="settings-btn" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h7M13 4h1M2 12h1M7 12h7M11 2v4M5 10v4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Settings</button>
    </div>
    </div>
    <div class="hero-main">
      <div class="titlewrap">
        <div class="crystalwrap" aria-hidden="true">
          <i class="cglow"></i>
          <div class="cfloat"><svg class="crystal" viewBox="0 0 72 104" aria-hidden="true">
            <ellipse class="orbit back" cx="36" cy="56" rx="35" ry="9"/>
            <polygon points="36,2 68,42 36,100 4,42" style="fill:rgb(var(--lamp))"/>
            <polygon points="36,2 68,42 36,52" style="fill:#fff;opacity:.45"/>
            <polygon points="4,42 36,100 36,52" style="fill:#000;opacity:.28"/>
            <polygon points="68,42 36,100 36,52" style="fill:rgb(var(--lamp2));opacity:.55"/>
            <polygon points="30,13 20,30 29,33" style="fill:#fff;opacity:.85"/>
            <path d="M36 2 68 42 36 100 4 42Z M4 42 36 52 68 42 M36 2 36 52 36 100" style="fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:1.2;stroke-linejoin:round"/>
            <path class="orbit front" d="M1 56a35 9 0 0 0 70 0"/>
          </svg></div>
          <i class="cshadow"></i>
        </div>
        <div class="l">
          <h1>Save <span class="hi">Point</span></h1>
          <div class="sub" id="subline">Every game you're playing, have beaten, and still mean to get to.</div>
        </div>
      </div>
      <div class="pcard" id="pcard"></div>
    </div>
  </section>

  <section class="deck" id="deck" aria-label="Now playing" hidden></section>

  <section class="rack" aria-label="Your game rack">
    <canvas class="sparks" id="sparks" aria-hidden="true"></canvas>
    <div class="row playing"><div class="rowlabel"><span class="px">Now</span><b>Playing</b><span class="n" id="n-playing">0</span></div><div class="slot"><div class="spines" id="row-playing"></div></div></div>
    <div class="row finished"><div class="rowlabel"><span class="px">Cleared</span><b>Finished</b><span class="n" id="n-finished">0</span></div><div class="slot"><div class="spines" id="row-finished"></div></div></div>
    <div class="row backlog"><div class="rowlabel"><span class="px">Queue</span><b>Backlog</b><span class="n" id="n-backlog">0</span><button class="spin" type="button" id="spin-btn">Pick for me</button></div><div class="slot"><div class="spines" id="row-backlog"></div></div></div>
  </section>

  <section class="console" aria-label="Find a game">
    <form id="search-form" autocomplete="off">
      <input id="q" type="search" placeholder="Search a game by title…" aria-label="Search for a game">
      <button class="btn primary" id="search-btn" type="submit">Find game</button>
    </form>
    <div id="results-wrap"></div>
    <div class="cfoot">
      <div class="note">Details come from Wikidata and covers from Steam; every field can be corrected. <button class="linkbtn" id="manual-btn" type="button">Add a game by hand</button></div>
      <button class="btn small" type="button" id="steam-btn"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1v9m0 0L4.5 6.5M8 10l3.5-3.5M2 12v2h12v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Import from Steam</button>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" id="tab-library" role="tab" aria-selected="true">Library</button>
    <button class="tab" id="tab-discover" role="tab" aria-selected="false">Discover</button>
    <button class="tab" id="tab-wishlist" role="tab" aria-selected="false">Wishlist</button>
    <button class="tab" id="tab-stats" role="tab" aria-selected="false">Stats</button>
    <button class="tab" id="tab-trophies" role="tab" aria-selected="false">Trophies</button>
  </nav>

  <main id="view-library">
    <div class="bar">
      <div class="seg" id="filter"></div>
      <label class="px" style="display:flex;align-items:center;gap:6px">Sort
        <select class="sort" id="sort">
          <option value="added">Recently added</option>
          <option value="played">Last played</option>
          <option value="title">Title</option>
          <option value="rating">Your rating</option>
          <option value="hours">Hours played</option>
          <option value="mc">Metacritic</option>
          <option value="year">Release year</option>
        </select>
      </label>
    </div>
    <div class="tools" id="tools"></div>
    <div id="list"></div>
  </main>
  <main id="view-discover" hidden><div id="view-next"></div><div id="disc"></div></main>
  <main id="view-wishlist" hidden></main>
  <main id="view-stats" hidden></main>
  <main id="view-trophies" hidden></main>

  <footer class="muted">
    <span id="storage-note"></span>
    <div class="row2"><button class="btn small" type="button" id="backup-btn">Save a backup</button><button class="btn small" type="button" id="restore-btn">Load a backup</button></div>
    <input type="file" id="restore-file" accept=".json,application/json" hidden>
    <span class="px">Save Point v<span id="ver"></span></span>
  </footer>
</div>
<div id="modal-root"></div>

<script>
(() => {
  "use strict";
  const VERSION = document.documentElement.dataset.ver;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const STATUS = { playing: "Playing", finished: "Finished", backlog: "Backlog", wishlist: "Wishlist", dropped: "Dropped" };
  const UNPLAYED = new Set(["backlog", "wishlist"]);
  const TABS = ["library", "discover", "wishlist", "stats", "trophies"];
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
  const isoOf = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const norm = s => String(s || "").toLowerCase().replace(/[™®©]/g, "").replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fmtH = h => { h = Math.round((Number(h) || 0) * 10) / 10; return (h % 1 ? h.toFixed(1) : String(h)) + " h"; };
  $("#ver").textContent = VERSION;

  // ================= local storage =================
  const LS = "save-point-games", LS_DEL = "save-point-deleted", LS_SET = "save-point-settings";
  const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
  let games = lsGet(LS, []), deleted = lsGet(LS_DEL, {});
  let settings = { theme: "auto", lamp: "arcade", goal: 12, motion: "full", skin: "retro", ...lsGet(LS_SET, {}) };
  let filter = "all", sortBy = "added", tab = "library", statYear = new Date().getFullYear(), libQ = "", nextMode = "fit";

  function saveLocal(){ const ok = lsSet(LS, games) && lsSet(LS_DEL, deleted); if (!ok) toast("This browser's storage is full. Remove some cover images, or save a backup."); return ok; }
  function commit(msg){ saveLocal(); render(); sync.schedule(); if (msg) toast(msg); checkTrophies(true); }
  function saveGame(g, msg){ g.updatedAt = lastLocalChange = Date.now(); const i = games.findIndex(x => x.id === g.id); i >= 0 ? games[i] = g : games.push(g); commit(msg); }
  function removeGame(id, msg){ games = games.filter(g => g.id !== id); deleted[id] = Date.now(); commit(msg); }
  function applySettings(){
    lsSet(LS_SET, settings);
    const r = document.documentElement;
    if (settings.theme === "auto") r.removeAttribute("data-theme"); else r.dataset.theme = settings.theme;
    r.dataset.lamp = settings.lamp;
    r.dataset.motion = settings.motion;
    r.dataset.skin = settings.skin;
  }
  applySettings();

  // ================= helpers =================
  function hashNum(s, mod){ let h = 7; for (const c of String(s)) h = (h * 33 + c.charCodeAt(0)) >>> 0; return h % mod; }
  const caseColor = g => "var(--c" + (hashNum(norm(g.title), 8) + 1) + ")";
  function platFamily(p){
    const s = String(p || "").toLowerCase();
    if (/playstation|ps\s?\d|ps vita|psp/.test(s)) return "ps";
    if (/xbox/.test(s)) return "xb";
    if (/switch|nintendo|wii|3ds|\bds\b|game ?boy|gamecube|n64/.test(s)) return "ns";
    if (/pc|windows|steam|mac|linux|deck|epic|gog/.test(s)) return "pc";
    if (/ios|android|mobile|iphone|ipad/.test(s)) return "mo";
    return "ot";
  }
  const PLAT_NAMES = { ps: "PlayStation", xb: "Xbox", ns: "Nintendo", pc: "PC", mo: "Mobile", ot: "Other" };
  function shortPlat(p){
    const s = String(p || "").trim(); if (!s) return "";
    const m = s.match(/(?:playstation|ps)\s*(\d)/i); if (m) return "PS" + m[1];
    if (/xbox series/i.test(s)) return "XSX"; if (/xbox one/i.test(s)) return "XB1"; if (/xbox 360/i.test(s)) return "X360";
    if (/switch 2/i.test(s)) return "NS2"; if (/switch/i.test(s)) return "SWITCH";
    if (/steam deck/i.test(s)) return "DECK"; if (/steam/i.test(s)) return "STEAM"; if (/^pc$|windows/i.test(s)) return "PC";
    return s.slice(0, 6).toUpperCase();
  }
  const pcVar = p => `var(--p-${platFamily(p)})`;
  const mainPlat = g => g.platform || (g.platforms || [])[0] || "";
  const steamImg = (id, f) => `https://cdn.cloudflare.steamstatic.com/steam/apps/${encodeURIComponent(id)}/${f}`;
  const steamCover = id => steamImg(id, "library_600x900_2x.jpg");
  // wide banner art: if it's missing, fall back to the blurred cover, then to the case colour
  const steamHeader = id => steamImg(id, "header.jpg");
  const uniq = a => [...new Set(a.filter(Boolean))];
  // every picture is a list of sources tried in order: your own image, the one you picked, Steam, Wikipedia
  const coverChain = g => g.coverPick === "none" && !g.cover ? [] : uniq([g.cover, g.coverPick, g.steamAppId && steamCover(g.steamAppId), g.coverUrl, g.steamAppId && steamHeader(g.steamAppId)]);

  async function withCovers(items, signal){

    const wire = () => {

      drop.addEventListener("dragleave", () => drop.classList.remove("over"));

      drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#f-cover").click(); } });
      $("#f-cover").addEventListener("change", e => { const f = e.target.files?.[0]; if (f) setCover(f); });
      $("#more")?.addEventListener("toggle", e => { moreOpen = e.target.open; });

    const grab = () => {
      const v = id => $("#" + id)?.value;
      d.title = (v("f-title") ?? d.title).trim(); d.platform = (v("f-platform") ?? "").trim(); d.hours = v("f-hours") ?? d.hours;
      d.developer = (v("f-dev") ?? "").trim(); d.genres = (v("f-genres") ?? "").split(",").map(s => s.trim()).filter(Boolean);
      d.year = v("f-year") ? Number(v("f-year")) : null; d.length = v("f-length") ? Number(v("f-length")) : null;
      d.metacritic = v("f-mc") ? Number(v("f-mc")) : null; if ($("#f-release")) d.release = dv("f-release"); d.steamAppId = (v("f-steam") ?? "").replace(/\D/g, "");
      if ($("#f-progress")) d.progress = Number(v("f-progress")) || 0;

    };

    const onPaste = e => { const f = imageFrom(e.clipboardData?.files); if (f) { e.preventDefault(); setCover(f); } };
    document.addEventListener("paste", onPaste);
    modalClose = () => { document.removeEventListener("paste", onPaste); prev?.focus?.(); };
    openModal(html(), e => {
      const t = e.target;

      const rs = t.closest("[data-rmsess]"); if (rs) { grab(); const s = d.sessions.find(x => x.d === rs.dataset.rmsess); d.sessions = d.sessions.filter(x => x !== s); if (s) d.hours = Math.max(0, Math.round(((Number(d.hours) || 0) - s.h) * 10) / 10); draw(); return; }

      if (t.id === "m-del") { $("#confirm-slot").innerHTML = `<div class="confirm"><span>Remove “${esc(d.title)}” from your library?</span><button class="btn danger small" type="button" id="m-del-yes">Remove</button><button class="btn small" type="button" id="m-del-no">Keep</button></div>`; return; }
      if (t.id === "m-del-no") { $("#confirm-slot").innerHTML = ""; return; }

      }
    }, e => {

      grab(); const cur = d[k] || "", t = todayISO();
      d[k] = { day: cur.length === 10 ? cur : cur.length === 7 ? cur + "-01" : cur.length === 4 ? cur + t.slice(4) : t, month: (cur || t).slice(0, 7), year: (cur || t).slice(0, 4), none: "" }[e.target.value];

  }

  // ================= art picker: box art and logos from Steam, Wikipedia and Wikidata =================
  const WIKI_LANGS = ["fr", "es", "it", "de", "pt", "pl", "ru", "ja", "ko", "zh"];
  const fileKey = n => String(n || "").replace(/^File:/i, "").replace(/_/g, " ").toLowerCase();
  async function findArt(g, signal){
    let wid = g.wikidata, wiki = g.wiki, appid = g.steamAppId;
    if (!wid) { try { const r = await lookupOne(g); if (r) { wid = r.wikidata; wiki = wiki || r.wiki; appid = appid || r.steamAppId; } } catch {} }
    const covers = [], logos = [], seen = new Set();
    const add = (list, url, src, key) => { const k = key ? fileKey(key) : url; if (!url || seen.has(k)) return; seen.add(k); list.push({ url, src }); };
    if (appid) { add(covers, steamCover(appid), "Steam"); add(covers, steamHeader(appid), "Steam banner"); add(logos, steamImg(appid, "logo.png"), "Steam"); }
    let sites = {};
    if (wid) {
      try {
        const e = (await wd({ action: "wbgetentities", ids: wid, props: "claims|sitelinks" }, signal)).entities?.[wid] || {};
        claimStr(e, "P154").forEach(f => add(logos, commonsFile(f, 600), "Wikidata", f));
        claimStr(e, "P18").forEach(f => add(covers, commonsFile(f, 600), "Wikimedia", f));
        sites = e.sitelinks || {}; wiki = wiki || sites.enwiki?.title;
      } catch (e) { if (e.name === "AbortError") throw e; }
    }
    if (wiki) {
      try {
        const j = await wp("en", { action: "query", titles: wiki, prop: "pageimages|images", piprop: "thumbnail|name", pithumbsize: 600, pilicense: "any", imlimit: 50, redirects: 1 }, signal);
        const pg = Object.values(j.query?.pages || {})[0] || {};
        if (pg.thumbnail?.source) add(covers, pg.thumbnail.source, "Wikipedia", pg.pageimage);
        const files = (pg.images || []).map(i => i.title).filter(t => /cover|box|art|key|poster|logo|wordmark/i.test(t) && !/commons-logo|wiki\w*-logo|question_book|edit-clear|symbol|icon|award|photograph|\(cropped\)/i.test(t) && (!/\.svg$/i.test(t) || /logo|wordmark/i.test(t)));
        if (files.length) {
          const info = await wp("en", { action: "query", titles: files.slice(0, 20).join("|"), prop: "imageinfo", iiprop: "url", iiurlwidth: 600 }, signal);
          for (const f of Object.values(info.query?.pages || {})) { const ii = f.imageinfo?.[0]; if (ii) add(/logo|wordmark/i.test(f.title) ? logos : covers, ii.thumburl || ii.url, "Wikipedia", f.title); }
        }
      } catch (e) { if (e.name === "AbortError") throw e; }
    }
    await Promise.all(WIKI_LANGS.filter(l => sites[l + "wiki"]).map(async l => {
      try { const t = sites[l + "wiki"].title, c = await wikiCovers(l, [t], signal); if (c[t]) add(covers, c[t].url, `Wikipedia (${l.toUpperCase()})`, c[t].name); } catch {}
    }));
    return { covers, logos, found: { wikidata: wid || "", wiki: wiki || "", steamAppId: appid || "" } };
  }
  function openArt(d, onPick){
    document.querySelector(".art-scrim")?.remove();

    const ctl = new AbortController();

    el.innerHTML = `<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="art-t"><div class="reshead"><h2 id="art-t">Choose art</h2><button class="btn small" type="button" data-artx>Cancel</button></div><div id="art-body"><div class="status"><span class="dots">Looking for box art and logos for “${esc(d.title)}”</span></div></div></div>`;
    document.body.append(el);
    let res = null;
    const curCover = () => pick.cover ? "upload" : pick.coverPick || coverChain(d)[0] || "none";
    const curLogo = () => pick.logoPick || logoChain(d)[0] || "none";
    const draw = () => {
      const cc = curCover(), cl = curLogo(), gen = { ...d, cover: "", coverPick: "none" };
      $("#art-body", el).innerHTML = `
        <div class="px" style="margin-bottom:8px">Box art</div>
        <div class="artgrid">${res.covers.map((c, i) => `<button type="button" class="arttile${c.url === cc ? " on" : ""}" data-cv="${i}" aria-label="Use box art from ${esc(c.src)}"><img src="${esc(c.url)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.closest('.arttile').remove()"><span>${esc(c.src)}</span></button>`).join("")}
          ${d.cover ? `<button type="button" class="arttile${cc === "upload" ? " on" : ""}" data-cv="upload"><img src="${esc(d.cover)}" alt=""><span>Your image</span></button>` : ""}
          <button type="button" class="arttile gen${cc === "none" ? " on" : ""}" data-cv="none">${boxHTML(gen)}<span>Generated</span></button></div>
        <div class="px" style="margin:16px 0 8px">Logo on the spine and Now playing</div>
        <div class="artgrid logos">${res.logos.map((c, i) => `<button type="button" class="arttile${c.url === cl ? " on" : ""}" data-lg="${i}" aria-label="Use logo from ${esc(c.src)}"><img src="${esc(c.url)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.closest('.arttile').remove()"><span>${esc(c.src)}</span></button>`).join("")}
          <button type="button" class="arttile plain${cl === "none" ? " on" : ""}" data-lg="none"><b>${esc(d.title)}</b><span>Title text</span></button></div>
        ${!res.covers.length && !res.logos.length ? `<div class="note" style="margin-top:12px">No pictures found for this game yet. Very new games often get theirs on Wikipedia within days.</div>` : ""}
        <div class="mfoot" style="margin-top:16px"><span class="note">Not here? Drop or paste your own image in the game's window. <a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(d.title + " box art")}" target="_blank" rel="noopener" style="color:var(--accent)">Search the web ↗</a></span><div class="r"><button class="btn primary" type="button" data-artok>Use these</button></div></div>`;
    };
    el.addEventListener("click", e => {
      const t = e.target;
      if (t === el || t.closest("[data-artx]")) { ctl.abort(); el.remove(); return; }

      if (cv) { const v = cv.dataset.cv; if (v === "upload") { pick.cover = d.cover; pick.coverPick = ""; } else { pick.cover = ""; pick.coverPick = v === "none" ? "none" : res.covers[+v].url; } draw(); return; }
