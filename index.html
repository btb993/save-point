      if (lg) { const v = lg.dataset.lg; pick.logoPick = v === "none" ? "none" : res.logos[+v].url; draw(); return; }
      if (t.closest("[data-artok]")) { el.remove(); onPick({ ...pick, ...Object.fromEntries(Object.entries(res.found).filter(([k, v]) => v && !d[k])), artChecked: true }); }
    });
    findArt(d, ctl.signal).then(r => { res = r; if (el.isConnected) draw(); }).catch(e => { if (e.name !== "AbortError" && el.isConnected) $("#art-body", el).innerHTML = `<div class="status">${navigator.onLine ? "The picture search didn't answer. Try again in a moment." : "You're offline, so the picture search isn't available."}</div>`; });
  }

  // ================= steam import =================
  const JUNK = /^(store page|community hub|find community content|view stats|view your stats|achievements?\b.*|perfect games|recently played|all games|games|sort by.*|search.*|add to collection|play|install|manage|properties|guides|discussions|workshop|screenshots|videos|news|reviews|hide|uninstall|favorites|uncategorized|collections|filter|steam|library|home|downloads|friends|chat|privacy settings|followed games|wishlist|inventory|groups|badges|.*\bacquired\b.*|last (two weeks|played).*|(\d+\s*\/\s*\d+|[\d.,]+%)|https?:\/\/.*)$/i;
  function parseImport(text){
    text = String(text || "").trim(); if (!text) return [];
    const out = [];
    const push = (name, hours, appid) => { name = String(name || "").replace(/\s+/g, " ").trim(); if (!name || name.length > 120) return; out.push({ name, hours: hours != null && !isNaN(hours) ? Math.round(hours * 10) / 10 : null, appid: appid ? String(appid) : "" }); };
    if (/^[\[{]/.test(text)) {
      try {
        const j = JSON.parse(text);
        const arr = j?.response?.games || j?.games || (Array.isArray(j) ? j : []);
        arr.forEach(g => typeof g === "string" ? push(g) : push(g.name || g.title, g.playtime_forever != null ? g.playtime_forever / 60 : g.hours, g.appid || g.appID || g.steamAppId));
        if (out.length) return dedupe(out);
      } catch {}
    }
    if (/<gamesList|<game>/i.test(text)) {
      try {
        const doc = new DOMParser().parseFromString(text, "text/xml");
        doc.querySelectorAll("game").forEach(n => { const t = s => n.querySelector(s)?.textContent || ""; const h = t("hoursOnRecord"); push(t("name"), h ? parseFloat(h.replace(",", "")) : null, t("appID")); });
        if (out.length) return dedupe(out);
      } catch {}
    }
    let last = null;
    for (const line of text.split(/\r?\n/)) {
      const t = line.trim(); if (!t) continue;
      const hm = t.match(/([\d][\d.,]*)\s*(hrs?|hours?|h)\b/i);
      if (hm && (/played|record|playtime/i.test(t) || /^[\d.,]+\s*(hrs?|hours?|h)\b/i.test(t))) { if (last && last.hours == null) last.hours = parseFloat(hm[1].replace(",", "")); continue; }
      const csv = t.match(/^(.+?)\s*[,;\t|]\s*([\d.]+)\s*(hrs?|hours?|h)?\s*$/i);
      if (csv && !/^\d+$/.test(csv[1])) { push(csv[1].replace(/^"|"$/g, ""), parseFloat(csv[2])); last = null; continue; }
      if (JUNK.test(t) || /^[\d\s.,:/-]+$/.test(t)) continue;
      push(t); last = out[out.length - 1];
    }
    return dedupe(out);
  }
  function dedupe(list){ const seen = new Set(); return list.filter(x => { const k = norm(x.name); if (!k || seen.has(k)) return false; seen.add(k); return true; }); }
  function openImport(){
    let rows = [], playedTo = "playing", unplayedTo = "backlog";
    const html = () => {
      const fresh = rows.filter(r => !r.dupe), pick = fresh.filter(r => r.on).length;
      return `<div class="modal wide imp" role="dialog" aria-modal="true" aria-label="Import from Steam">
        <div class="reshead"><h2>Import from Steam</h2><button class="btn small" type="button" data-mclose>Close</button></div>
        ${!rows.length ? `
        <ol class="how">
          <li><b>Copy and paste (easiest).</b> In Steam, open your profile, then <b>Games</b>, then <b>All games</b>. Select the whole page (Ctrl+A), copy (Ctrl+C) and paste it below. Hours come along too.</li>
          <li><b>Or upload a file</b>, which also brings the covers. Open <code>https://steamcommunity.com/id/YOUR-NAME/games?tab=all&amp;xml=1</code> (or <code>/profiles/YOUR-ID/…</code>), save the page with Ctrl+S, and choose it below. Your Game details must be Public in Steam's privacy settings.</li>
          <li>A plain list works too: one game per line, optionally <code>Name, hours</code>.</li>
        </ol>
        <textarea id="imp-text" placeholder="Paste your Steam games page or a list of games here…"></textarea>
        <div class="reshead"><label class="btn small" style="cursor:pointer">Choose a file<input type="file" id="imp-file" accept=".xml,.json,.txt,.csv,.html,.htm" hidden></label><button class="btn primary" type="button" id="imp-read">Read list</button></div>`
        : `
        <div class="reshead"><span class="px">${fresh.length} game${fresh.length === 1 ? "" : "s"} found${rows.length > fresh.length ? ` · ${rows.length - fresh.length} already in your library` : ""}</span><span class="chips"><button class="chip" type="button" id="imp-all">Select all</button><button class="chip" type="button" id="imp-none">Select none</button></span></div>
        <div class="reshead"><label class="note" style="display:flex;gap:6px;align-items:center">Games with play time go to <select class="sort" id="imp-played">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === playedTo ? "selected" : ""}>${v}</option>`).join("")}</select></label><label class="note" style="display:flex;gap:6px;align-items:center">Unplayed go to <select class="sort" id="imp-unplayed">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === unplayedTo ? "selected" : ""}>${v}</option>`).join("")}</select></label></div>
        <div class="implist">${rows.map((r, i) => `<div class="irow${r.dupe ? " dupe" : ""}"><input type="checkbox" data-ri="${i}" ${r.on ? "checked" : ""} ${r.dupe ? "disabled" : ""} aria-label="Import ${esc(r.name)}"><span class="nm" title="${esc(r.name)}">${esc(r.name)}</span><span class="h">${r.hours ? fmtH(r.hours) : "–"}</span>${r.dupe ? `<span class="px">In library</span>` : `<select data-rs="${i}" aria-label="Status for ${esc(r.name)}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === r.status ? "selected" : ""}>${v}</option>`).join("")}</select>`}</div>`).join("")}</div>
        <div class="note">Uncheck anything that isn't a game. Afterwards, Fill missing details in the Library adds genres, studios and covers.</div>
        <div class="mfoot"><button class="btn small" type="button" id="imp-back">Start over</button><div class="r"><button class="btn primary" type="button" id="imp-go" ${pick ? "" : "disabled"}>Import ${pick} game${pick === 1 ? "" : "s"}</button></div></div>`}
      </div>`;
    };
    const draw = () => { $("#scrim").innerHTML = html(); wire(); };
    const wire = () => $("#imp-file")?.addEventListener("change", async e => { const f = e.target.files?.[0]; if (f) { $("#imp-text").value = await f.text(); readList(); } });
    const readList = () => {
      const parsed = parseImport($("#imp-text").value);
      if (!parsed.length) { toast("No games found in that text. Try copying the whole Steam games page."); return; }
      rows = parsed.map(p => { const dupe = !!findSame({ title: p.name, steamAppId: p.appid }); return { ...p, dupe, on: !dupe, status: p.hours > 0 ? playedTo : unplayedTo }; });
      draw();
    };
    openModal(html(), e => {
      const id = e.target.id;
      if (id === "imp-read") return readList();
      if (id === "imp-back") { rows = []; draw(); return; }
      if (id === "imp-all" || id === "imp-none") { rows.forEach(r => { if (!r.dupe) r.on = id === "imp-all"; }); draw(); return; }
      if (id === "imp-go") {
        const sel = rows.filter(r => r.on && !r.dupe), now = Date.now();
        sel.forEach((r, i) => games.push({ id: newId(), title: r.name, platform: "PC", platforms: ["PC"], steamAppId: r.appid || "", hours: r.hours || "", status: r.status, rating: 0, progress: 0, started: "", finished: "", notes: "", genres: [], sessions: [], cover: "", added: new Date(now - i).toISOString(), updatedAt: now }));
        closeModal(); showTab("library");
        commit(`Imported ${sel.length} game${sel.length === 1 ? "" : "s"}. Press Fill missing details to add genres and covers.`);
      }
    }, e => {
      if (e.target.matches("[data-ri]")) { rows[+e.target.dataset.ri].on = e.target.checked; const pick = rows.filter(r => r.on && !r.dupe).length; const b = $("#imp-go"); b.textContent = `Import ${pick} game${pick === 1 ? "" : "s"}`; b.disabled = !pick; }
      if (e.target.matches("[data-rs]")) rows[+e.target.dataset.rs].status = e.target.value;
      if (e.target.id === "imp-played" || e.target.id === "imp-unplayed") {
        if (e.target.id === "imp-played") playedTo = e.target.value; else unplayedTo = e.target.value;
        rows.forEach(r => { r.status = r.hours > 0 ? playedTo : unplayedTo; }); draw();
      }
    });
    wire();
  }

  // ================= roulette =================
  function openRoulette(){
    const pool = games.filter(g => g.status === "backlog"); if (!pool.length) return;
    const any = () => pool[Math.floor(Math.random() * pool.length)];
    const spin = () => {
      const pick = any(), strip = [...Array.from({ length: 28 }, any), pick, any()];
      $("#scrim").innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Backlog roulette">
        <div class="reshead"><h2>Backlog roulette</h2><button class="btn small" type="button" data-mclose>Close</button></div>
        <div class="reel"><div class="win"></div><div class="strip" id="strip">${strip.map(g => `<div class="it">${esc(g.title)}</div>`).join("")}</div></div>
        <div id="picked" aria-live="polite"></div></div>`;
      const el = $("#strip"), target = (strip.length - 2) * 58 - (210 / 2 - 29);
      const done = () => {
        $("#picked").innerHTML = `<div class="picked">${boxHTML(pick)}<div class="meta"><div class="px">Your next game</div><div class="t" style="font-size:24px">${esc(pick.title)}</div>
          <div class="facts">${pick.length ? `<span>~${pick.length} h to beat</span>` : ""}${(pick.genres || []).length ? `<span>${esc(pick.genres[0])}</span>` : ""}${mainPlat(pick) ? `<span>${esc(mainPlat(pick))}</span>` : ""}</div>
          <div class="qa" style="margin-top:8px"><button class="btn primary small" type="button" data-start="${esc(pick.id)}">Start playing</button><button class="btn small" type="button" id="respin">Spin again</button></div></div></div>`;
      };
      if (reduceMotion || !el.animate) { el.style.transform = `translateY(${-target}px)`; done(); return; }
      el.animate([{ transform: "translateY(0)" }, { transform: `translateY(${-target}px)` }], { duration: 2600, easing: "cubic-bezier(.12,.75,.2,1)", fill: "forwards" }).onfinish = done;
    };
    openModal("", e => {
      if (e.target.id === "respin") return spin();
      const s = e.target.closest("[data-start]"); if (s) { startPlaying(s.dataset.start); closeModal(); }
    });
    spin();
  }
  function startPlaying(id){

  }

  // ================= settings =================
  const SKINS = [["retro", "Retro", "Arcade grid, pixel type, neon"], ["modern", "Modern", "Clean console dashboard, glass and glow"], ["fantasy", "Fantasy", "Night peaks, gold lettering, wooden shelves"]];
  const LAMPS = { arcade: ["Arcade", "122,150,255", "255,140,90"], sunset: ["Sunset", "255,150,80", "255,90,130"], neon: ["Neon", "255,80,210", "60,230,255"], forest: ["Forest", "110,220,150", "240,205,95"] };
  let installEvt = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#install-top").hidden = false; });
  addEventListener("appinstalled", () => { installEvt = null; $("#install-top").hidden = true; toast("Save Point is installed. Open it from your apps or home screen."); });
  $("#install-top").addEventListener("click", () => { if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; $("#install-top").hidden = true; }); });
  function openSettings(focusGoal){
    const html = () => `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="set-t">
      <div class="reshead"><h2 id="set-t">Settings</h2><button class="btn small" type="button" data-mclose>Done</button></div>
      <div class="opts">
        <div class="opt"><span class="px">Theme</span><div class="skins">${SKINS.map(([k, n, d]) => `<button type="button" class="skin ${k}" data-skinpick="${k}" aria-pressed="${settings.skin === k}"><i class="sw"><b>Aa</b></i><strong>${n}</strong><span>${d}</span></button>`).join("")}</div></div>
        <div class="opt"><span class="px">Rack lighting</span><div class="lamps">${Object.entries(LAMPS).map(([k, [n, a, b]]) => `<button type="button" data-lamp="${k}" aria-pressed="${settings.lamp === k}"><i style="--a:rgba(${a},.7);--b:rgb(${b})"></i>${n}</button>`).join("")}</div></div>
        <div class="opt"><span class="px">Banner motion</span><div class="seg">${[["full","Full"],["calm","Calm"],["off","Off"]].map(([k, v]) => `<button type="button" data-motion="${k}" aria-pressed="${settings.motion === k}">${v}</button>`).join("")}</div></div>
        <div class="opt"><span class="px">Appearance</span><div class="seg">${[["auto","Match device"],["light","Light"],["dark","Dark"]].map(([k, v]) => `<button type="button" data-theme="${k}" aria-pressed="${settings.theme === k}">${v}</button>`).join("")}</div></div>
        <label class="opt field"><span class="px">${new Date().getFullYear()} goal: games to finish</span><input id="set-goal" type="number" min="1" max="500" inputmode="numeric" value="${esc(settings.goal)}" style="max-width:140px"></label>
        ${installEvt ? `<div class="opt"><span class="px">App</span><div><button class="btn small" type="button" id="install-btn">Install Save Point on this device</button></div></div>` : ""}
      </div></div>`;
    openModal(html(), e => {
      const l = e.target.closest("[data-lamp]"); if (l) { settings.lamp = l.dataset.lamp; applySettings(); $("#scrim").innerHTML = html(); return; }
      const sk = e.target.closest("[data-skinpick]"); if (sk) { settings.skin = sk.dataset.skinpick; applySettings(); $("#scrim").innerHTML = html(); return; }
      const mo = e.target.closest("[data-motion]"); if (mo) { settings.motion = mo.dataset.motion; applySettings(); $("#scrim").innerHTML = html(); return; }
      const t = e.target.closest("[data-theme]"); if (t) { settings.theme = t.dataset.theme; applySettings(); $("#scrim").innerHTML = html(); return; }
      if (e.target.id === "install-btn") { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; closeModal(); }); }
    }, e => { if (e.target.id === "set-goal") { settings.goal = Math.max(1, Math.min(500, +e.target.value || 12)); applySettings(); renderPlayer(); } });
    if (focusGoal) $("#set-goal")?.select();
  }

  // ================= backup =================
  function backup(){
    const data = JSON.stringify({ app: "save-point", version: 2, exported: new Date().toISOString(), games }, null, 1);
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = `save-point-backup-${todayISO()}.json`;
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  async function restore(file){
    try {
      const j = JSON.parse(await file.text()); const list = Array.isArray(j) ? j : j.games;
      if (!Array.isArray(list)) throw 0;
      const now = Date.now();
      const add = list.filter(g => g && g.title && !games.some(x => x.id === g.id || norm(x.title) === norm(g.title)));
      add.forEach(g => { games.push({ ...g, id: g.id || newId(), updatedAt: now }); delete deleted[g.id]; });
      commit(add.length ? `Loaded ${add.length} game${add.length === 1 ? "" : "s"} from the backup` : "Everything in that backup is already here");
    } catch { toast("That file isn't a Save Point backup."); }
  }

  // ================= sync (shares your Book Nook's Supabase project and login) =================
  const sync = (() => {
    const TABLE = "game_library";
    const DEFAULT = { url: "https://adkfuzmontecmhfnrcyb.supabase.co", key: "sb_publishable_sDtY-M37SKKBOqUe0mlZUA_jOrOW4E9" };
    const shared = lsGet("reading-ledger-sync", null);
    const cfg = shared?.url && shared?.key ? { url: shared.url, key: shared.key } : DEFAULT;
    const ref = (cfg.url.match(/https:\/\/([a-z0-9]+)\.supabase\.co/) || [])[1] || "";
    const SQL = `create table if not exists public.${TABLE} (
  user_id uuid primary key references auth.users(id) on delete cascade,
  data jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);
alter table public.${TABLE} enable row level security;
create policy "read own games" on public.${TABLE} for select using (auth.uid() = user_id);
create policy "add own games" on public.${TABLE} for insert with check (auth.uid() = user_id);
create policy "change own games" on public.${TABLE} for update using (auth.uid() = user_id);
alter publication supabase_realtime add table public.${TABLE};`;
    let client = null, user = null, state = "off", detail = "", busy = false, again = false, timer = null, lastPush = null, chan = null, lastOk = null;
    const LABEL = { off: "Sync", signedout: "Sign in to sync", syncing: "Syncing…", ok: "Synced", setup: "Finish sync setup", offline: "Offline", error: "Sync problem" };
    function paint(){
      $("#sync-label").textContent = LABEL[state] || "Sync";
      $("#sync-dot").className = "dot " + (state === "ok" ? "ok" : state === "syncing" ? "busy" : ["setup", "error", "signedout"].includes(state) ? "warn" : "");
      $("#storage-note").textContent = user && state === "ok" ? `Synced to your account (${user.email}). Changes reach your other devices within seconds.` : "Your games are saved on this device. Sign in with your Book Nook account to sync them to your phone.";
      if ($("#sync-panel")) panel();
    }
    const set = (s, d = "") => { state = s; detail = d; if (s === "ok") lastOk = new Date(); paint(); };
    const sig = lib => (lib.games || []).map(g => g.id + ":" + (g.updatedAt || 0)).sort().join(",") + "|" + Object.keys(lib.deleted || {}).sort().join(",");
    function merge(a, b){
      const del = { ...(a.deleted || {}) };
      for (const [k, v] of Object.entries(b.deleted || {})) del[k] = Math.max(del[k] || 0, v);
      const m = new Map();
      for (const g of [...(a.games || []), ...(b.games || [])]) {
        const have = m.get(g.id);
        if (!have) { m.set(g.id, g); continue; }
        const [old, nw] = (g.updatedAt || 0) >= (have.updatedAt || 0) ? [have, g] : [g, have];
        const sess = new Map(); [...(old.sessions || []), ...(nw.sessions || [])].forEach(s => sess.set(s.d, s));
        m.set(g.id, { ...nw, sessions: [...sess.values()].sort((x, y) => x.d.localeCompare(y.d)) });
      }
      return { games: [...m.values()].filter(g => !(del[g.id] && del[g.id] >= (g.updatedAt || 0))), deleted: del };
    }
    const missingTable = e => ["42P01", "PGRST205", "PGRST202"].includes(e?.code) || /game_library|schema cache|does not exist/i.test(e?.message || "");
    async function connect(){
      if (!window.supabase?.createClient) return set("off");
      try { client = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "reading-ledger-auth" } }); }
      catch { return set("error", "The sync settings don't look right."); }
      const { data } = await client.auth.getSession(); user = data.session?.user || null;
      client.auth.onAuthStateChange((_e, s) => { const u = s?.user || null, changed = (u?.id || null) !== (user?.id || null); user = u; if (changed) { if (user) { subscribe(); pull(); } else { unsubscribe(); set("signedout"); } } });
      if (user) { subscribe(); pull(); } else set("signedout");
    }
    async function pull(){
      if (!client || !user) return;
      if (busy) { again = true; return; }
      busy = true; set("syncing");
      try {
        const { data, error } = await client.from(TABLE).select("data, updated_at").eq("user_id", user.id).maybeSingle();
        if (error) throw error;
        const remote = data?.data || null, local = { games, deleted };
        const merged = remote ? merge(local, remote) : local;
        if (sig(merged) !== sig(local)) { games = merged.games; deleted = merged.deleted; saveLocal(); render(); }
        if (!remote || sig(merged) !== sig(remote)) {
          lastPush = new Date().toISOString();
          const { error: e2 } = await client.from(TABLE).upsert({ user_id: user.id, data: { games: merged.games, deleted: merged.deleted, app: "save-point" }, updated_at: lastPush });
          if (e2) throw e2;
        }
        set("ok");
      } catch (e) {
        if (missingTable(e)) set("setup");
        else if (!navigator.onLine) set("offline");
        else set("error", e?.message || "Something went wrong.");
      } finally { busy = false; if (again) { again = false; pull(); } }
    }
    function subscribe(){
      unsubscribe(); if (!client || !user) return;
      try { chan = client.channel("games-" + user.id).on("postgres_changes", { event: "*", schema: "public", table: TABLE, filter: `user_id=eq.${user.id}` }, p => { if (p.new?.updated_at && lastPush && new Date(p.new.updated_at).getTime() === new Date(lastPush).getTime()) return; pull(); }).subscribe(); } catch {}
    }
    function unsubscribe(){ if (chan) { try { client.removeChannel(chan); } catch {} chan = null; } }
    function schedule(){ if (!user) return; clearTimeout(timer); timer = setTimeout(pull, 1200); }
    addEventListener("online", () => pull());
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });

    let authMode = "in", authMsg = "";
    function panel(){
      const el = $("#sync-panel"); if (!el) return;
      const head = `<div class="reshead"><h2>Sync between your devices</h2><button class="btn small" type="button" data-mclose>Close</button></div>`;
      const appUrl = location.protocol.startsWith("http") ? location.href.split("#")[0] : "";
      const phone = appUrl ? `<div class="opt"><span class="px">On your phone</span><div class="urlbox"><span>${esc(appUrl)}</span><button class="btn small" type="button" data-copy="${esc(appUrl)}">Copy</button></div><div class="note">Open this address on your phone and sign in. iPhone: Safari, Share, Add to Home Screen. Android: Chrome, ⋮ menu, Install app.</div></div>` : "";
      if (!window.supabase?.createClient) { el.innerHTML = head + `<p class="note">The sync library couldn't load. Check your internet connection and reload.</p>`; return; }
      if (!user) {
        el.innerHTML = head + `<p class="note" style="margin:0">Use the same email and password as your Book Nook. Your games go into your own Supabase database, next to your books, and only you can sign in to it.</p>
          <form class="authf" id="auth-form"><input id="au-email" type="email" autocomplete="email" placeholder="Email" required><input id="au-pass" type="password" autocomplete="${authMode === "in" ? "current-password" : "new-password"}" placeholder="Password" minlength="6" required>
          <div class="reshead"><button class="btn primary" type="submit">${authMode === "in" ? "Sign in" : "Create account"}</button><button class="linkbtn" type="button" id="au-mode">${authMode === "in" ? "New here? Create an account" : "Have an account? Sign in"}</button></div>
          ${authMsg ? `<div class="note">${esc(authMsg)}</div>` : ""}</form>`;
        return;
      }
      if (state === "setup") {
        el.innerHTML = head + `<p style="margin:0">You're signed in as <b>${esc(user.email)}</b>. One last, one-time step: give your database a place for games.</p>
          <ol class="steps"><li><button class="btn small" type="button" data-copy-sql>Copy the database setup</button></li>
          <li><a class="btn small" href="https://supabase.com/dashboard/project/${esc(ref)}/sql/new" target="_blank" rel="noopener">Open the Supabase SQL editor ↗</a> and sign in if asked.</li>
          <li>Paste it in and press <b>Run</b>. It should say “Success. No rows returned.”</li>
          <li><button class="btn primary small" type="button" data-retry>Check again</button></li></ol>
          <div class="note">This only adds a new table for games. Your Book Nook data isn't touched.</div>`;
        return;
      }
      el.innerHTML = head + `<p style="margin:0">Signed in as <b>${esc(user.email)}</b>.</p>
        <p class="note" style="margin:0">${state === "ok" ? `Everything is synced${lastOk ? ` (checked ${lastOk.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })})` : ""}.` : state === "syncing" ? "Syncing now…" : state === "offline" ? "You're offline. Changes sync when you're back." : `Sync stopped: ${esc(detail)}`}</p>
        <div class="chips"><button class="btn small" type="button" data-retry>Sync now</button><button class="btn small" type="button" data-signout>Sign out</button></div>
        ${phone}
        <div class="note">Signing out here also signs this browser out of your Book Nook, because they share one login.</div>`;
    }
    function open(){
      openModal(`<div class="modal" role="dialog" aria-modal="true" aria-label="Sync" id="sync-panel"></div>`, async e => {
        const t = e.target;
        if (t.id === "au-mode") { authMode = authMode === "in" ? "up" : "in"; authMsg = ""; panel(); return; }
        if (t.closest("[data-retry]")) { pull(); return; }
        if (t.closest("[data-signout]")) { await client.auth.signOut(); return; }
        const c = t.closest("[data-copy]"); if (c) { copy(c.dataset.copy, "Address copied"); return; }
        if (t.closest("[data-copy-sql]")) { copy(SQL, "Database setup copied"); return; }
      });
      $("#scrim").addEventListener("submit", async e => {
        if (e.target.id !== "auth-form") return; e.preventDefault();
        const email = $("#au-email").value.trim(), password = $("#au-pass").value;
        authMsg = authMode === "in" ? "Signing in…" : "Creating your account…"; panel(); $("#au-email").value = email;
        const res = authMode === "in" ? await client.auth.signInWithPassword({ email, password }) : await client.auth.signUp({ email, password });
        if (res.error) { authMsg = res.error.message; panel(); $("#au-email").value = email; return; }
        if (authMode === "up" && !res.data.session) { authMsg = "Check your email to confirm the account, then sign in here."; authMode = "in"; panel(); }
      });
      panel();
    }
    async function copy(text, ok){ try { await navigator.clipboard.writeText(text); toast(ok); } catch { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); toast(ok); } catch { toast("Couldn't copy. Select the text and copy it yourself."); } ta.remove(); } }
    return { connect, schedule, pull, open, paint, get state(){ return state; } };
  })();

  // ================= wiring =================
  function render(){
    renderPlayer(); renderDeck(); renderRack(); renderLibrary();
    if (tab === "stats") renderStats();
    if (tab === "discover") { renderNext(); renderDiscover(); }
    if (tab === "wishlist") renderWishlist();
    if (tab === "trophies") renderTrophies();
    checkTrophies(false);
    if (lastResults.length && $("#results-wrap .results")) renderResults("list");
  }
  function showTab(t){
    tab = t;
    for (const k of TABS) { $("#tab-" + k).setAttribute("aria-selected", k === t); $("#view-" + k).hidden = k !== t; }
    if (t === "stats") renderStats();
    if (t === "discover") { renderNext(); renderDiscover(true); }
    if (t === "wishlist") renderWishlist();
    if (t === "trophies") renderTrophies();
    try { history.replaceState(null, "", t === "library" ? location.pathname : "#" + t); } catch {}
  }
  const openById = id => { const g = games.find(x => x.id === id); if (g) openEditor(g, false); };
  document.addEventListener("keydown", e => { if (e.key !== "Escape") return; const art = document.querySelector(".art-scrim"); if (art) { art.remove(); return; } if (root.innerHTML) closeModal(); });
  $("#search-form").addEventListener("submit", e => { e.preventDefault(); runSearch($("#q").value); });
  $("#manual-btn").addEventListener("click", () => openEditor({ title: $("#q").value.trim() }, true));
  $("#steam-btn").addEventListener("click", openImport);
  $("#spin-btn").addEventListener("click", openRoulette);
  $("#settings-btn").addEventListener("click", () => openSettings());
  $("#sync-btn").addEventListener("click", () => sync.open());
  $("#backup-btn").addEventListener("click", backup);
  $("#restore-btn").addEventListener("click", () => $("#restore-file").click());
  $("#restore-file").addEventListener("change", e => { const f = e.target.files?.[0]; if (f) restore(f); e.target.value = ""; });
  $("#pcard").addEventListener("click", e => { if (e.target.closest("#goal-btn")) openSettings(true); });
  $("#results-wrap").addEventListener("click", e => {
    const chip = e.target.closest("[data-q]"); if (chip) { $("#q").value = chip.dataset.q; return runSearch(chip.dataset.q); }
    if (e.target.closest("[data-close]")) return closeResults();
    if (e.target.closest("[data-manual]")) return openEditor({ title: lastQuery }, true);
    const qa = e.target.closest("[data-qadd]");
    if (qa) {
      const r = lastResults[+qa.dataset.qadd], st = qa.dataset.qs;
      saveGame({ ...r, id: newId(), status: st, rating: 0, hours: "", progress: st === "finished" ? 100 : 0, started: st === "playing" ? todayISO() : "", finished: "", notes: "", sessions: [], cover: "", platform: (r.platforms || []).length === 1 ? r.platforms[0] : "", added: new Date().toISOString(), lookedUp: true, artChecked: true },
        st === "finished" ? `Added ${r.title} as played. Tap the stars to rate it.` : `Added ${r.title} to ${STATUS[st]}`);
      return;
    }
    const qr = e.target.closest("[data-qrate]");
    if (qr) { const g = games.find(x => x.id === qr.dataset.qrate); if (g) { const v = +qr.dataset.v; saveGame({ ...g, rating: g.rating === v ? 0 : v }); } return; }
    const add = e.target.closest("[data-add]"); if (add) return openEditor({ ...lastResults[+add.dataset.add], lookedUp: true, artChecked: true }, true);
    const op = e.target.closest("[data-open]"); if (op) openById(op.dataset.open);
  });
  for (const sel of ["#deck", ".rack", "#list", "#view-stats", "#view-next", "#view-wishlist", "#view-trophies"]) $(sel).addEventListener("click", e => {
    if (e.target.closest("[data-review]")) return openReview(+e.target.closest("[data-review]").dataset.review);
    if (e.target.closest("[data-goto]")) return showTab(e.target.closest("[data-goto]").dataset.goto);
    const tb = e.target.closest("[data-tstart]"); if (tb) { startTimer(tb.dataset.tstart); return; }
    const ts = e.target.closest("[data-tstop]"); if (ts) { stopTimer(ts); return; }
    const mv = e.target.closest("[data-move]"); if (mv) { const g = games.find(x => x.id === mv.dataset.id); if (g) saveGame({ ...g, status: mv.dataset.move, started: mv.dataset.move === "playing" ? (g.started || todayISO()) : g.started }, `${g.title} moved to ${STATUS[mv.dataset.move]}`); return; }
    const y = e.target.closest("[data-year]"); if (y) { statYear = +y.dataset.year; renderStats(); return; }
    const m = e.target.closest("[data-mode]"); if (m) { nextMode = m.dataset.mode; renderNext(); return; }
    const l = e.target.closest("[data-log]"); if (l) { logSession(l.dataset.log, +l.dataset.h, l); return; }
    const b = e.target.closest("[data-beat]"); if (b) { markBeaten(b.dataset.beat); return; }
    const st = e.target.closest("[data-start]"); if (st) { startPlaying(st.dataset.start); return; }
    if (e.target.closest("[data-steam]")) return openImport();
    if (e.target.closest("[data-restore]")) return $("#restore-file").click();
    if (e.target.closest("[data-focus-search]")) { $("#q").focus(); $("#q").scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" }); return; }
    const s = e.target.closest("[data-open]"); if (s) openById(s.dataset.open);
  });
  for (const sel of ["#view-stats"]) {
    $(sel).addEventListener("mousemove", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(e, t.dataset.tip); else if (tipEl) tipEl.hidden = true; });
    $(sel).addEventListener("mouseleave", () => { if (tipEl) tipEl.hidden = true; });
  }
  $("#tools").addEventListener("click", e => { if (e.target.id === "fill-btn") fillDetails(e.target); });
  $("#tools").addEventListener("input", e => { if (e.target.id === "libq") { libQ = e.target.value; renderLibrary(); } });
  $("#filter").addEventListener("click", e => { const f = e.target.closest("[data-filter]"); if (f) { filter = f.dataset.filter; renderLibrary(); } });
  $("#sort").addEventListener("change", e => { sortBy = e.target.value; renderLibrary(); });
  for (const k of TABS) $("#tab-" + k).addEventListener("click", () => showTab(k));
  // another tab of this app changed the library
  addEventListener("storage", e => { if (e.key === LS) { games = lsGet(LS, []); deleted = lsGet(LS_DEL, {}); render(); } });

  const hashTab = location.hash.slice(1); if (TABS.includes(hashTab) && hashTab !== "library") showTab(hashTab);
  renderResults("idle");
  render();
  sync.paint();
  startSparks();
  addEventListener("load", () => { sync.connect(); });
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
