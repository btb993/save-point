<!doctype html>
<html lang="en" data-ver="1.3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Save Point</title>
<meta name="description" content="Your game log: what you're playing, have finished and still mean to play.">
<meta name="theme-color" content="#151B27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Save Point">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Silkscreen&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: a player card header (level, XP, streak, yearly goal) beside sync and settings buttons;
   a "Now playing" console with big cards and quick session logging; the game rack (three lit shelves
   of boxed spines capped in platform colours, pixel sparks drifting over them, lit by a chosen lamp);
   the search console with Steam import; then Library, Stats and Up next. Rack and console stay dark. */
:root{
  color-scheme:light;
  --bg:#E6EAF1; --panel:#F8FAFC; --ink:#131925; --muted:#586276; --line:#C8D0DD;
  --accent:#2343C4; --accent-ink:#FFFFFF; --accent-soft:#DCE2FA;
  --hot:#E2602A; --good:#24804D; --star:#D99A12;
  --rack:#1A2130; --rack2:#10151F; --slot:#090D14;
  --deck-ink:#E9EDF6; --deck-muted:#94A0BA; --deck-line:#2A3448;
  --lamp:122,150,255; --lamp2:255,140,90;
  --c1:#3B4C8F; --c2:#8A3B3B; --c3:#2F6E62; --c4:#7A5A1E; --c5:#5E3F80; --c6:#2C5D86; --c7:#7F4A63; --c8:#4F6430;
  --p-ps:#2F5BD3; --p-xb:#2E8A3E; --p-ns:#D8352A; --p-pc:#6B7484; --p-mo:#8A4FC2; --p-ot:#9A8A62;
  --shadow:0 1px 2px rgba(20,30,50,.08),0 8px 22px rgba(20,30,50,.10);
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-pixel:"Silkscreen","Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1119; --panel:#151B26; --ink:#E5E9F0; --muted:#8E99AC; --line:#262F42;
  --accent:#8199FF; --accent-ink:#0D1119; --accent-soft:#1F2948;
  --hot:#FF8A55; --good:#5CC48A; --star:#F2BE45;
  --rack:#151B27; --rack2:#0B1018; --slot:#06090E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1119; --panel:#151B26; --ink:#E5E9F0; --muted:#8E99AC; --line:#262F42;
  --accent:#8199FF; --accent-ink:#0D1119; --accent-soft:#1F2948;
  --hot:#FF8A55; --good:#5CC48A; --star:#F2BE45;
  --rack:#151B27; --rack2:#0B1018; --slot:#06090E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark}
:root[data-lamp="sunset"]{--lamp:255,150,80;--lamp2:255,90,130}
:root[data-lamp="neon"]{--lamp:255,80,210;--lamp2:60,230,255}
:root[data-lamp="forest"]{--lamp:110,220,150;--lamp2:240,205,95}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.5;
  background-image:radial-gradient(ellipse 80% 420px at 50% -60px,rgba(var(--lamp),.18),transparent 70%);background-repeat:no-repeat;
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(40px,7.5vw,68px);line-height:.9;text-transform:uppercase;font-style:italic;letter-spacing:-.02em}
h1 .hi{color:var(--hot);text-shadow:0 0 22px color-mix(in srgb,var(--hot) 45%,transparent)}
h2{font-size:26px}
h3{font-size:18.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.px{font-family:var(--f-pixel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hp{display:flex;align-items:center;gap:5px}
.hp i{display:block;width:14px;height:12px;background:var(--hot);clip-path:polygon(20% 0,40% 0,50% 15%,60% 0,80% 0,100% 20%,100% 45%,50% 100%,0 45%,0 20%)}
.hp i.off{background:var(--line)}
.tb{display:flex;gap:8px}
.ibtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;box-shadow:var(--shadow)}
.ibtn:hover{border-color:var(--muted)}
.ibtn .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.ibtn .dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
.ibtn .dot.busy{background:var(--accent);animation:blink 1s infinite}
.ibtn .dot.warn{background:var(--hot)}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 24px}
header .l{display:flex;flex-direction:column;gap:8px;min-width:0}
header .sub{color:var(--muted);max-width:52ch}

/* player card */
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);min-width:min(100%,380px)}
.lvl{grid-row:span 2;display:grid;place-items:center;width:58px;height:58px;border-radius:12px;background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--hot)));color:#fff;font-family:var(--f-display);font-weight:700;line-height:1;text-align:center}
.lvl small{display:block;font-family:var(--f-pixel);font-size:8.5px;letter-spacing:.08em;opacity:.85}
.lvl b{font-size:26px}
.xp{display:flex;flex-direction:column;gap:4px;min-width:0}
.xpbar{height:10px;border-radius:2px;background:var(--bg);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.xpbar span{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,color-mix(in srgb,var(--accent) 80%,#fff) 10px 12px);transition:width .6s}
.pstats{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 10px}
.pstats .fire{color:var(--hot);font-weight:700}
.goal{grid-row:span 2;position:relative;width:58px;height:58px;border:0;background:none;padding:0;cursor:pointer}
.goal svg{width:58px;height:58px;transform:rotate(-90deg)}
.goal .gv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
.goal .gv small{display:block;font-family:var(--f-pixel);font-size:7px;color:var(--muted);font-weight:400;margin-top:2px}
.goal circle{fill:none;stroke-width:6}
.goal .tr{stroke:var(--line)}
.goal .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .8s}

/* ---------- now playing ---------- */
.deck{position:relative;border-radius:18px;padding:18px;background:linear-gradient(180deg,var(--rack),var(--rack2));color:var(--deck-ink);box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
.deck::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 120% at 0% 0%,rgba(var(--lamp2),.22),transparent 60%),radial-gradient(ellipse 50% 100% at 100% 100%,rgba(var(--lamp),.14),transparent 60%);pointer-events:none}
.deckhead{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.deckhead h2{font-size:22px;text-transform:uppercase;font-style:italic;color:#fff}
.deckhead .px{color:var(--deck-muted)}
.live{display:inline-flex;align-items:center;gap:8px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:rgb(var(--lamp2));box-shadow:0 0 10px rgb(var(--lamp2));animation:blink 1.6s ease-in-out infinite}
.npgrid{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.np{position:relative;display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--deck-line);overflow:hidden;isolation:isolate}
.np{min-height:176px}
.np .bgart{position:absolute;inset:0;z-index:-2;background:var(--c);overflow:hidden}
.np .bgart img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%;transition:transform 1.2s ease}
.np:hover .bgart img{transform:scale(1.04)}
.np.blur .bgart{inset:-24px;filter:blur(28px) saturate(1.3);opacity:.5}
.np .shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,11,18,.94) 0%,rgba(8,11,18,.80) 45%,rgba(8,11,18,.35) 100%)}
.np .logo{display:none;max-width:min(260px,100%);max-height:66px;object-fit:contain;object-position:left center;filter:drop-shadow(0 2px 10px rgba(0,0,0,.7))}
.np.haslogo .logo{display:block}
.np.haslogo .tt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.np .box{--fs:13px;cursor:pointer;border:0;padding:0}
.np .body{min-width:0;display:flex;flex-direction:column;gap:7px}
.np .t{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.08;color:#fff;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.np .t:hover{text-decoration:underline;text-underline-offset:3px}
.np .sub{font-size:14px;color:var(--deck-muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.segs i{height:12px;border-radius:2px;background:rgba(255,255,255,.08)}
.segs i.on{background:linear-gradient(180deg,#7CF0A8,#2EB872);box-shadow:0 0 8px rgba(80,220,140,.45)}
.segs i.part{background:linear-gradient(90deg,#3FC982 var(--p),rgba(255,255,255,.08) var(--p))}
.prog{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--deck-muted);font-variant-numeric:tabular-nums}
.prog b{color:#fff;font-weight:700}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.qbtn{border:1px solid var(--deck-line);background:rgba(255,255,255,.06);color:var(--deck-ink);border-radius:8px;padding:5px 11px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;transition:background .15s,transform .1s}
.qbtn:hover{background:rgba(255,255,255,.14)}
.qbtn:active{transform:scale(.96)}
.qbtn.win{border-color:#3FC982;color:#7CF0A8}
.qbtn.win:hover{background:rgba(63,201,130,.16)}
.plus{position:fixed;pointer-events:none;font-family:var(--f-pixel);font-size:14px;color:#7CF0A8;text-shadow:0 0 8px rgba(80,220,140,.8);animation:floatup 1s ease-out forwards;z-index:60}
@keyframes floatup{to{transform:translateY(-34px);opacity:0}}
@media (max-width:520px){.np{grid-template-columns:84px minmax(0,1fr);gap:12px}.np .t{font-size:19px}}

/* ---------- rack ---------- */
.rack{position:relative;border-radius:16px;padding:16px 14px 14px;background:linear-gradient(180deg,var(--rack),var(--rack2));box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
.rack::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.row{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:stretch}
.row + .row{margin-top:12px}
.rowlabel{display:flex;flex-direction:column;justify-content:end;gap:3px;padding:6px 0 10px;color:var(--deck-ink)}
.rowlabel .px{color:var(--deck-muted)}
.rowlabel b{font-family:var(--f-display);font-size:18px;line-height:1.1;color:#fff}
.rowlabel .n{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.rowlabel .spin{margin-top:6px;align-self:start;border:1px solid var(--deck-line);background:rgba(255,255,255,.06);color:var(--deck-ink);border-radius:8px;padding:3px 9px;font-family:var(--f-pixel);font-size:10px;cursor:pointer}
.rowlabel .spin:hover{background:rgba(255,255,255,.14)}
.slot{position:relative;background:radial-gradient(ellipse at 50% 125%,rgba(var(--rl,var(--lamp)),.24),transparent 70%),var(--slot);border-radius:7px;box-shadow:inset 0 10px 16px rgba(0,0,0,.6);overflow:hidden}
.slot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,rgba(var(--rl,var(--lamp)),.7),transparent)}
.row.playing{--rl:var(--lamp2)}
.row.finished{--rl:90,220,150}
.spines{display:flex;align-items:flex-end;gap:3px;height:176px;overflow-x:auto;overflow-y:hidden;padding:16px 10px 3px;scrollbar-width:thin;scrollbar-color:#333c52 transparent}
.spine{flex:0 0 auto;position:relative;width:34px;height:150px;border:0;padding:0;cursor:pointer;border-radius:3px 3px 1px 1px;background:var(--c,var(--c1));color:#F3F5FA;
  background-image:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.16) 18%,rgba(255,255,255,.02) 40%,rgba(0,0,0,.05) 70%,rgba(0,0,0,.38));
  display:flex;flex-direction:column;align-items:center;transition:transform .22s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.spine:hover,.spine:focus-visible{transform:translateY(-10px);box-shadow:0 0 18px rgba(var(--lamp),.55)}
.spine .band{width:100%;height:20px;background:var(--pc,var(--p-ot));border-radius:3px 3px 0 0;display:flex;align-items:center;justify-content:center;font-family:var(--f-pixel);font-size:7.5px;font-style:normal;color:#fff;overflow:hidden;white-space:nowrap;box-shadow:inset 0 -1px 0 rgba(0,0,0,.3)}
.spine span{flex:1;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-display);font-weight:600;font-size:13px;line-height:1;padding:6px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-height:118px}
.spine .pip{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:rgb(var(--lamp2));box-shadow:0 0 8px rgb(var(--lamp2));animation:blink 1.6s ease-in-out infinite}
.spine .cr{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:8px;color:#FFD86B;letter-spacing:-1px;font-style:normal}
@keyframes blink{50%{opacity:.35}}
.spine.ghost{opacity:.14;pointer-events:none}
.spine .band{position:relative;z-index:2}
.spine span{position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.spine .sbg{position:absolute;inset:20px 0 0;overflow:hidden;z-index:0;border-radius:0 0 1px 1px}
.spine .sbg img{width:100%;height:100%;object-fit:cover;transform:scale(1.6);filter:blur(5px) saturate(1.25) brightness(.62)}
.spine .sbg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.12) 22%,transparent 45%,rgba(0,0,0,.4))}
.spine .slogo{position:absolute;left:50%;top:calc(50% + 10px);width:112px;height:28px;transform:translate(-50%,-50%) rotate(-90deg);display:flex;align-items:center;justify-content:center;z-index:1;pointer-events:none}
.spine .slogo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 1px rgba(0,0,0,.9)) drop-shadow(0 0 3px rgba(255,255,255,.35))}
.spine.haslogo span{visibility:hidden}
.spine .slogo img.inv,.np .logo.inv{filter:invert(1) drop-shadow(0 0 2px rgba(0,0,0,.6))}
@media (max-width:560px){.spine .slogo{width:90px;height:24px}}
.emptyrow{align-self:center;color:#AEB8CE;font-style:italic;padding:0 14px;white-space:nowrap;margin-bottom:60px}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr);gap:4px}.rowlabel{flex-direction:row;align-items:baseline;gap:8px;padding:0 2px}.rowlabel .n{font-size:18px}.rowlabel>.px{display:none}.rowlabel .spin{margin:0 0 0 auto}.spines{height:150px}.spine{height:126px;width:30px}.spine span{max-height:96px}}

/* ---------- console (search) ---------- */
.console{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.console form{display:flex;gap:8px;flex-wrap:wrap}
.console input[type=search]{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px;font-size:17px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 16px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15.5px;letter-spacing:.02em;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--hot);border-color:var(--hot);background:transparent}
.btn.small{padding:4px 11px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 12px;font-size:15px;cursor:pointer}
.chip:hover,.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.status{color:var(--muted)}
.dots::after{content:"";display:inline-block;width:1.2em;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.reshead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.results{display:grid;gap:10px}
.note{font-size:14.5px;color:var(--muted)}
.cfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center}

/* ---------- box art ---------- */
.box{position:relative;aspect-ratio:3/4;width:100%;max-width:100%;border-radius:4px;overflow:hidden;background:var(--c,var(--c1));color:#F3F5FA;
  box-shadow:0 2px 4px rgba(0,0,0,.18),0 10px 18px rgba(20,30,50,.16)}
.box .band{position:absolute;inset:0 0 auto;height:13%;background:var(--pc,var(--p-ot));display:flex;align-items:center;padding:0 8%;font-family:var(--f-pixel);font-size:calc(var(--fs,14px) * .6);color:#fff;white-space:nowrap;overflow:hidden;z-index:1}
.box .art{position:absolute;inset:13% 0 0;padding:10% 9%;display:flex;flex-direction:column;justify-content:space-between;background-image:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.3))}
.box .emb{position:absolute;right:-12%;bottom:-8%;width:78%;aspect-ratio:1;opacity:.22}
.box .bt{position:relative;font-family:var(--f-display);font-weight:700;font-style:italic;text-transform:uppercase;font-size:var(--fs,14px);line-height:1.02;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.box .bd{position:relative;font-size:calc(var(--fs,14px) * .62);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box img.cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;background:var(--c)}
.box::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 30%,transparent 70%,rgba(255,255,255,.06));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

.res{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:14px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}

.meta{min-width:0;display:flex;flex-direction:column;gap:3px}

.summary{font-size:15.5px}
.plats{display:flex;flex-wrap:wrap;gap:4px}
.plat{font-family:var(--f-pixel);font-size:9.5px;padding:1px 6px;border-radius:3px;color:#fff;background:var(--pc,var(--p-ot))}
.side{display:flex;flex-direction:column;align-items:end;gap:6px}

@media (max-width:560px){.res{grid-template-columns:54px minmax(0,1fr)}.side{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap}}

/* ---------- tabs ---------- */

/* ---------- library ---------- */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 13px;cursor:pointer;font-size:15px}

select.sort,.field select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 8px;font-size:14.5px}

@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}}
.game{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;perspective:600px}

.game .gt{font-family:var(--f-display);font-weight:700;font-size:16.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.game .gs{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.mini span{display:block;height:100%;background:var(--good)}
.pill{font-family:var(--f-pixel);font-size:9.5px;padding:1px 6px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.pill.playing{color:var(--hot)} .pill.finished{color:var(--good)} .pill.backlog{color:var(--accent)} .pill.dropped{color:var(--muted)}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:30px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);margin-top:18px}

.starter{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;width:100%;max-width:760px;margin-top:6px}
.starter button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink)}
.starter button:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.starter b{font-family:var(--f-display);font-size:17px}
.starter span{font-size:14px;color:var(--muted)}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}

.kpi .s{font-size:13.5px;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.wide{grid-column:1/-1}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) 58px;gap:10px;align-items:center;font-size:14.5px}
.hb .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.hb .k i{flex:0 0 auto;width:9px;height:9px;border-radius:2px;background:var(--fill)}
.hb .t{height:12px;border-radius:0 4px 4px 0;background:var(--bg);overflow:hidden}
.hb .t span{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--fill,var(--accent))}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cols{position:relative;display:grid;grid-template-columns:repeat(var(--n,12),minmax(0,1fr));gap:4px;align-items:end;height:170px;padding:16px 0 0;border-bottom:1px solid var(--line)}
.cols .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);pointer-events:none}
.cols .gl span{position:absolute;right:0;top:-15px;font-variant-numeric:tabular-nums}
.col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.col span{width:72%;max-width:34px;border-radius:4px 4px 0 0;background:var(--accent);transition:filter .15s}
.col:hover span{filter:brightness(1.2)}
.col.cur span{background:var(--hot)}
.xl{display:grid;grid-template-columns:repeat(var(--n,12),minmax(0,1fr));gap:4px;font-family:var(--f-pixel);font-size:8.5px;color:var(--muted);text-align:center;margin-top:5px}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;align-items:end;height:130px;padding-top:16px}
.mo{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.mo .c{width:100%;display:flex;flex-direction:column-reverse;gap:2px}
.mo .c i{display:block;height:9px;background:var(--good);border-radius:1px}
.mo .c i.now{background:var(--hot)}
.mo .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mo .m{font-family:var(--f-pixel);font-size:8.5px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.heat i{border-radius:2px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--good) 35%,var(--bg));box-shadow:none}
.heat i.l2{background:color-mix(in srgb,var(--good) 65%,var(--bg));box-shadow:none}
.heat i.l3{background:var(--good);box-shadow:none}
.heatkey{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted)}
.heatkey i{width:11px;height:11px;border-radius:2px}
.yearsel{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vs{display:grid;gap:8px}
.vsrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14.5px}
.vsrow .d{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.vsrow .d.up{color:var(--good)} .vsrow .d.down{color:var(--hot)}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);max-width:260px}

/* ---------- up next ---------- */
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.rec{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.rec .box{--fs:10px}
.because{font-size:14.5px;border-left:3px solid var(--hot);padding-left:8px;color:var(--ink)}
.rank{font-family:var(--f-pixel);font-size:10px;color:var(--hot)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,9,15,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(640px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:pop .22s cubic-bezier(.3,1.4,.5,1)}
.modal.wide{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.96)}}
.mhead{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start}
.mhead .box{--fs:12.5px}
.coverctl{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:13.5px}
.coverctl .links{display:flex;flex-wrap:wrap;gap:2px 10px}
.coverctl a{color:var(--accent)}
.drop{border:1.5px dashed var(--accent);border-radius:8px;padding:6px 8px;color:var(--muted);text-align:center;cursor:pointer;background:color-mix(in srgb,var(--accent) 5%,transparent)}
.drop.over{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;width:100%;min-width:0;font-size:15.5px}
.field input[type=range]{padding:0;accent-color:var(--good)}
.field textarea{resize:vertical;min-height:60px}
.datepick{display:flex;gap:6px;align-items:center}
.datepick select{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 6px;font-size:14.5px}
.datepick input{flex:1 1 auto}
.datepick .dnote{flex:1;color:var(--muted);font-size:14.5px;padding:7px 4px}
.statpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.statpick button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 4px;cursor:pointer;font-size:15px}
.statpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.starpick{display:flex;align-items:center;gap:2px}
.sp{position:relative;display:inline-block;width:32px;height:34px;font-size:30px;line-height:34px;text-align:center;color:var(--line)}
.sp::before{content:"★"}
.sp.full::before{color:var(--star)}
.sp.half::after{content:"★";position:absolute;left:0;top:0;width:50%;overflow:hidden;color:var(--star);text-align:left;padding-left:1px}
.sp button{position:absolute;top:0;bottom:0;width:50%;border:0;background:transparent;cursor:pointer;padding:0;z-index:1}
.sp button:first-child{left:0}
.sp button:last-child{right:0}
.sp:hover{transform:scale(1.08)}
.starpick .rv{margin-left:8px;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--star);min-width:2ch}
.starpick.mini .sp{width:24px;height:26px;font-size:22px;line-height:26px}
.starpick.mini .rv{font-size:14px}
.stars .hst{position:relative;font-style:normal;display:inline-block}
.stars .hst::before{content:"★";position:absolute;left:0;top:0;width:50%;overflow:hidden}
.stars .emp{font-style:normal;opacity:.45}
details.more{border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.more[open]{padding-bottom:12px}
details.more summary{cursor:pointer;padding:10px 0;font-family:var(--f-display);font-weight:600;list-style-position:inside}
details.more summary .muted{font-family:var(--f-body);font-weight:400;font-size:13.5px;margin-left:6px}
.qadd{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.qadd .btn{white-space:nowrap}
.sess{display:flex;flex-wrap:wrap;gap:6px}
.sess span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:1px 4px 1px 8px;font-size:13.5px;font-variant-numeric:tabular-nums}
.sess button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px}
.mfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.mfoot .r{display:flex;gap:8px;margin-left:auto}
.confirm{background:var(--bg);border:1px solid var(--hot);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:520px){.mhead{grid-template-columns:92px minmax(0,1fr)}.fields{grid-template-columns:minmax(0,1fr)}.statpick{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* import */
.imp textarea{width:100%;min-height:130px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}
.how{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px}
.how code{font-size:13px;background:var(--bg);padding:1px 5px;border-radius:4px;word-break:break-all}
.implist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.irow{display:grid;grid-template-columns:auto minmax(0,1fr) 64px 118px;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:14.5px}
.irow:last-child{border-bottom:0}
.irow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .h{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.irow select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 4px;font-size:13.5px;min-width:0}
.irow.dupe{opacity:.55}
@media (max-width:520px){.irow{grid-template-columns:auto minmax(0,1fr) 92px}.irow .h{display:none}}

/* roulette */
.reel{position:relative;height:210px;overflow:hidden;border-radius:12px;background:linear-gradient(180deg,var(--rack),var(--rack2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:70px;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(180deg,var(--rack2),transparent)}
.reel::after{bottom:0;background:linear-gradient(0deg,var(--rack2),transparent)}
.reel .win{position:absolute;left:10px;right:10px;top:50%;height:58px;transform:translateY(-50%);border:2px solid rgb(var(--lamp2));border-radius:10px;box-shadow:0 0 22px rgba(var(--lamp2),.5);z-index:3;pointer-events:none}
.reel .strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.reel .it{height:58px;display:flex;align-items:center;justify-content:center;padding:0 20px;font-family:var(--f-display);font-weight:700;font-size:22px;color:#fff;text-transform:uppercase;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picked{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center}
.picked .box{--fs:12px}

/* settings & sync */
.opts{display:grid;gap:16px}
.opt{display:flex;flex-direction:column;gap:6px}
.lamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lamps button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px}
.lamps button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);font-weight:700}
.lamps i{width:100%;height:30px;border-radius:6px;background:radial-gradient(ellipse at 50% 130%,var(--a),transparent 70%),#0B1018;box-shadow:inset 0 -3px 0 var(--b)}
@media (max-width:420px){.lamps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.authf{display:grid;gap:10px}
.authf input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;width:100%}
.steps{margin:0;padding-left:20px;display:grid;gap:8px}
.urlbox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;font-size:14px;word-break:break-all}
.urlbox span{flex:1;min-width:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:10px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
footer{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13.5px}
footer .row2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* ---------- title screen ---------- */
.hero{--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--ink:#EEF2FA;--muted:#9AA6BF;--bg:rgba(0,0,0,.35);--accent:#8199FF;--accent-soft:#1F2948;--hot:#FF8A55;--good:#5CC48A;
  position:relative;isolation:isolate;overflow:hidden;border-radius:22px;padding:16px 22px 46px;color:var(--ink);display:flex;flex-direction:column;gap:22px;
  background:radial-gradient(ellipse 70% 80% at 50% 108%,rgba(var(--lamp2),.30),transparent 62%),linear-gradient(180deg,#080B14,#121a2b 58%,#0A0E17);
  box-shadow:0 18px 40px rgba(10,14,24,.35),inset 0 0 0 1px rgba(255,255,255,.07)}
.sky{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky::before{content:"";position:absolute;inset:0 0 45% 0;opacity:.8;background-image:
  radial-gradient(1.2px 1.2px at 8% 22%,#fff,transparent),radial-gradient(1px 1px at 18% 64%,#cfe0ff,transparent),radial-gradient(1.4px 1.4px at 27% 12%,#fff,transparent),
  radial-gradient(1px 1px at 39% 40%,#ffd9c7,transparent),radial-gradient(1.2px 1.2px at 52% 18%,#fff,transparent),radial-gradient(1px 1px at 61% 58%,#cfe0ff,transparent),
  radial-gradient(1.5px 1.5px at 73% 26%,#fff,transparent),radial-gradient(1px 1px at 84% 52%,#ffd9c7,transparent),radial-gradient(1.2px 1.2px at 93% 14%,#fff,transparent);
  animation:twinkle 9s ease-in-out infinite alternate;will-change:opacity}
@keyframes twinkle{to{opacity:.5}}
/* the floor only ever slides (a GPU move), slowly, with soft lines, so it stays smooth and easy on the eyes */
.floor{position:absolute;left:-60%;right:-60%;bottom:-4px;height:85%;overflow:hidden;
  transform:perspective(240px) rotateX(64deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 5%,rgba(0,0,0,.5) 40%,transparent 72%);mask-image:linear-gradient(to top,#000 5%,rgba(0,0,0,.5) 40%,transparent 72%)}
.floor .grid{position:absolute;left:0;right:0;top:-60px;bottom:0;
  background-image:linear-gradient(rgba(var(--lamp),.42) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(var(--lamp),.32) 1.5px,transparent 1.5px);background-size:60px 60px;
  animation:gridmove 7s linear infinite;will-change:transform;backface-visibility:hidden}
@keyframes gridmove{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,60px,0)}}
.horizon{position:absolute;left:10%;right:10%;bottom:30%;height:70px;background:radial-gradient(ellipse 50% 100% at 50% 100%,rgba(var(--lamp2),.22),transparent 70%)}
.hero .topbar{position:relative}

.cglow{position:absolute;left:50%;top:42%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:radial-gradient(circle,rgba(var(--lamp),.42),rgba(var(--lamp2),.12) 45%,transparent 70%);animation:glow 5s ease-in-out infinite;will-change:opacity}
.cfloat{position:relative;animation:bob 5s ease-in-out infinite;will-change:transform}

.crystal .orbit{fill:none;stroke:rgb(var(--lamp2));stroke-width:1.3;stroke-dasharray:3 7}
.crystal .orbit.back{stroke-opacity:.35}
.cshadow{position:absolute;left:8px;right:8px;bottom:0;height:12px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(var(--lamp),.6),transparent 70%);animation:cshadow 5s ease-in-out infinite;will-change:transform,opacity}
@keyframes bob{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-7px,0)}}
@keyframes cshadow{50%{transform:scaleX(.72);opacity:.5}}

/* banner motion setting, and a full stop while the banner is scrolled out of view */

/* ---------- moments ---------- */
.ach{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;display:flex;gap:12px;align-items:center;
  background:linear-gradient(180deg,#1B2232,#0F141F);color:#EEF2FA;border:1px solid rgba(var(--lamp2),.6);border-radius:14px;padding:10px 20px 10px 12px;

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(() => {
  "use strict";
  const VERSION = document.documentElement.dataset.ver;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const STATUS = { playing: "Playing", finished: "Finished", backlog: "Backlog", dropped: "Dropped" };
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
  const isoOf = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const norm = s => String(s || "").toLowerCase().replace(/[™®©]/g, "").replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fmtH = h => { h = Math.round((Number(h) || 0) * 10) / 10; return (h % 1 ? h.toFixed(1) : String(h)) + " h"; };
  $("#ver").textContent = VERSION;

  // ================= local storage =================
  const LS = "save-point-games", LS_DEL = "save-point-deleted", LS_SET = "save-point-settings";
  const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
  let games = lsGet(LS, []), deleted = lsGet(LS_DEL, {});
  let settings = { theme: "auto", lamp: "arcade", goal: 12, motion: "full", ...lsGet(LS_SET, {}) };
  let filter = "all", sortBy = "added", tab = "library", statYear = new Date().getFullYear(), libQ = "", nextMode = "fit";

  function saveLocal(){ const ok = lsSet(LS, games) && lsSet(LS_DEL, deleted); if (!ok) toast("This browser's storage is full. Remove some cover images, or save a backup."); return ok; }
  function commit(msg){ saveLocal(); render(); sync.schedule(); if (msg) toast(msg); }
  function saveGame(g, msg){ g.updatedAt = lastLocalChange = Date.now(); const i = games.findIndex(x => x.id === g.id); i >= 0 ? games[i] = g : games.push(g); commit(msg); }
  function removeGame(id, msg){ games = games.filter(g => g.id !== id); deleted[id] = Date.now(); commit(msg); }
  function applySettings(){
    lsSet(LS_SET, settings);
    const r = document.documentElement;
    if (settings.theme === "auto") r.removeAttribute("data-theme"); else r.dataset.theme = settings.theme;
    r.dataset.lamp = settings.lamp;
    r.dataset.motion = settings.motion;
  }
  applySettings();

  // ================= helpers =================
  function hashNum(s, mod){ let h = 7; for (const c of String(s)) h = (h * 33 + c.charCodeAt(0)) >>> 0; return h % mod; }
  const caseColor = g => "var(--c" + (hashNum(norm(g.title), 8) + 1) + ")";
  function platFamily(p){
    const s = String(p || "").toLowerCase();
    if (/playstation|ps\s?\d|ps vita|psp/.test(s)) return "ps";
    if (/xbox/.test(s)) return "xb";
    if (/switch|nintendo|wii|3ds|\bds\b|game ?boy|gamecube|n64/.test(s)) return "ns";
    if (/pc|windows|steam|mac|linux|deck|epic|gog/.test(s)) return "pc";
    if (/ios|android|mobile|iphone|ipad/.test(s)) return "mo";
    return "ot";
  }
  const PLAT_NAMES = { ps: "PlayStation", xb: "Xbox", ns: "Nintendo", pc: "PC", mo: "Mobile", ot: "Other" };
  function shortPlat(p){
    const s = String(p || "").trim(); if (!s) return "";
    const m = s.match(/(?:playstation|ps)\s*(\d)/i); if (m) return "PS" + m[1];
    if (/xbox series/i.test(s)) return "XSX"; if (/xbox one/i.test(s)) return "XB1"; if (/xbox 360/i.test(s)) return "X360";
    if (/switch 2/i.test(s)) return "NS2"; if (/switch/i.test(s)) return "SWITCH";
    if (/steam deck/i.test(s)) return "DECK"; if (/steam/i.test(s)) return "STEAM"; if (/^pc$|windows/i.test(s)) return "PC";
    return s.slice(0, 6).toUpperCase();
  }
  const pcVar = p => `var(--p-${platFamily(p)})`;
  const mainPlat = g => g.platform || (g.platforms || [])[0] || "";
  const steamImg = (id, f) => `https://cdn.cloudflare.steamstatic.com/steam/apps/${encodeURIComponent(id)}/${f}`;
  const steamCover = id => steamImg(id, "library_600x900_2x.jpg");
  // wide banner art: if it's missing, fall back to the blurred cover, then to the case colour
  const steamHeader = id => steamImg(id, "header.jpg");
  const uniq = a => [...new Set(a.filter(Boolean))];
  // every picture is a list of sources tried in order: your own image, the one you picked, Steam, Wikipedia
  const coverChain = g => g.coverPick === "none" && !g.cover ? [] : uniq([g.cover, g.coverPick, g.steamAppId && steamCover(g.steamAppId), g.coverUrl, g.steamAppId && steamHeader(g.steamAppId)]);
  const logoChain = g => g.logoPick === "none" ? [] : uniq([g.logoPick, g.steamAppId && steamImg(g.steamAppId, "logo.png"), g.logoUrl]);
  const coverSrc = g => coverChain(g)[0] || "";
  // a broken picture tries the next source, then disappears so the generated art shows
  window.spCoverErr = img => { const l = (img.dataset.fb || "").split("|").filter(Boolean); if (l.length) { img.src = l.shift(); img.dataset.fb = l.join("|"); } else img.remove(); };
  // black logos would vanish on dark spines, so they are shown in white
  window.spLogoOk = (img, sel) => { img.classList.toggle("inv", /black|dark/i.test(decodeURIComponent(img.src))); img.closest(sel)?.classList.add("haslogo"); };
  window.spHeroErr = img => { img.closest(".np,.mban")?.classList.add("blur"); spCoverErr(img); };
  const chainImg = (list, attrs = "", err = "spCoverErr") => list.length ? `<img src="${esc(list[0])}" data-fb="${esc(list.slice(1).join("|"))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="${err}(this)" ${attrs}>` : "";
  const imgTag = (g, cls = "cv") => chainImg(coverChain(g), `class="${cls}"`);
  function emblem(g){
    const shapes = [
      `<circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="8"/><circle cx="50" cy="50" r="16" fill="#fff"/>`,
      `<path d="M50 6 94 84H6z" fill="none" stroke="#fff" stroke-width="8"/>`,
      `<rect x="14" y="14" width="72" height="72" fill="none" stroke="#fff" stroke-width="8" transform="rotate(45 50 50)"/>`,
      `<path d="M10 50h80M50 10v80" stroke="#fff" stroke-width="14"/>`
    ];
    return `<svg class="emb" viewBox="0 0 100 100" aria-hidden="true">${shapes[hashNum(g.title || "x", 4)]}</svg>`;
  }
  function boxHTML(g, tag = "div", attrs = ""){
    const p = mainPlat(g);
    return `<${tag} class="box" ${attrs} style="--c:${caseColor(g)};--pc:${pcVar(p)}"><div class="band">${esc(shortPlat(p) || "GAME")}</div><div class="art">${emblem(g)}<span class="bt">${esc(g.title)}</span><span class="bd">${esc(g.developer || "")}</span></div>${imgTag(g)}</${tag}>`;
  }
  // ratings go in half stars: 0.5 to 5
  const stars = n => { n = Math.round((n || 0) * 2) / 2; if (!n) return ""; const f = Math.floor(n), h = n % 1 ? 1 : 0; return "★".repeat(f) + (h ? `<i class="hst">☆</i>` : "") + `<i class="emp">${"☆".repeat(5 - f - h)}</i>`; };
  const starText = n => n ? `${String(n).replace(".5", "½")}★` : "";
  function starsInput(v, attr){
    v = Number(v) || 0;
    return `<div class="starpick" role="group" aria-label="Rating">${[1,2,3,4,5].map(n => `<span class="sp${v >= n ? " full" : v >= n - .5 ? " half" : ""}"><button type="button" ${attr} data-v="${n - .5}" aria-label="${n - .5} stars"></button><button type="button" ${attr} data-v="${n}" aria-label="${n} star${n > 1 ? "s" : ""}"></button></span>`).join("")}<span class="rv">${v ? String(v).replace(".5", "½") : ""}</span></div>`;
  }
  const mcNum = g => { const n = Number(g.metacritic); return n > 0 && n <= 100 ? Math.round(n) : null; };
  function mcBadge(g){
    const n = mcNum(g); if (!n) return "";
    const col = n >= 75 ? "var(--good)" : n >= 50 ? "var(--star)" : "var(--hot)";
    return `<span class="mc"><b style="--mcc:${col}">${n}</b>${esc(g.criticBy || "Metacritic")}</span>`;
  }
  // dates can be exact ("2026-09-14"), a month ("2026-09"), a year ("2026") or unknown ("")
  const precOf = v => !v ? "none" : v.length === 4 ? "year" : v.length === 7 ? "month" : "day";
  function dateField(d, key, label){

    if (appid) { add(covers, steamCover(appid), "Steam"); add(covers, steamHeader(appid), "Steam banner"); add(logos, steamImg(appid, "logo.png"), "Steam"); }
    let sites = {};

        claimStr(e, "P154").forEach(f => add(logos, commonsFile(f, 600), "Wikidata", f));
        claimStr(e, "P18").forEach(f => add(covers, commonsFile(f, 600), "Wikimedia", f));
        sites = e.sitelinks || {}; wiki = wiki || sites.enwiki?.title;
      } catch (e) { if (e.name === "AbortError") throw e; }
    }
    if (wiki) {
      try {
        const j = await wp("en", { action: "query", titles: wiki, prop: "pageimages|images", piprop: "thumbnail|name", pithumbsize: 600, pilicense: "any", imlimit: 50, redirects: 1 }, signal);
        const pg = Object.values(j.query?.pages || {})[0] || {};
        if (pg.thumbnail?.source) add(covers, pg.thumbnail.source, "Wikipedia", pg.pageimage);
        const files = (pg.images || []).map(i => i.title).filter(t => /cover|box|art|key|poster|logo|wordmark/i.test(t) && !/commons-logo|wiki\w*-logo|question_book|edit-clear|symbol|icon|award|photograph|\(cropped\)/i.test(t) && (!/\.svg$/i.test(t) || /logo|wordmark/i.test(t)));
        if (files.length) {

          for (const f of Object.values(info.query?.pages || {})) { const ii = f.imageinfo?.[0]; if (ii) add(/logo|wordmark/i.test(f.title) ? logos : covers, ii.thumburl || ii.url, "Wikipedia", f.title); }

  // ================= steam import =================
  const JUNK = /^(store page|community hub|find community content|view stats|view your stats|achievements?\b.*|perfect games|recently played|all games|games|sort by.*|search.*|add to collection|play|install|manage|properties|guides|discussions|workshop|screenshots|videos|news|reviews|hide|uninstall|favorites|uncategorized|collections|filter|steam|library|home|downloads|friends|chat|privacy settings|followed games|wishlist|inventory|groups|badges|.*\bacquired\b.*|last (two weeks|played).*|(\d+\s*\/\s*\d+|[\d.,]+%)|https?:\/\/.*)$/i;
  function parseImport(text){
    text = String(text || "").trim(); if (!text) return [];
    const out = [];
    const push = (name, hours, appid) => { name = String(name || "").replace(/\s+/g, " ").trim(); if (!name || name.length > 120) return; out.push({ name, hours: hours != null && !isNaN(hours) ? Math.round(hours * 10) / 10 : null, appid: appid ? String(appid) : "" }); };
    if (/^[\[{]/.test(text)) {
      try {
        const j = JSON.parse(text);
        const arr = j?.response?.games || j?.games || (Array.isArray(j) ? j : []);
        arr.forEach(g => typeof g === "string" ? push(g) : push(g.name || g.title, g.playtime_forever != null ? g.playtime_forever / 60 : g.hours, g.appid || g.appID || g.steamAppId));
        if (out.length) return dedupe(out);
      } catch {}
    }
    if (/<gamesList|<game>/i.test(text)) {
      try {
        const doc = new DOMParser().parseFromString(text, "text/xml");
        doc.querySelectorAll("game").forEach(n => { const t = s => n.querySelector(s)?.textContent || ""; const h = t("hoursOnRecord"); push(t("name"), h ? parseFloat(h.replace(",", "")) : null, t("appID")); });
        if (out.length) return dedupe(out);
      } catch {}
    }
    let last = null;
    for (const line of text.split(/\r?\n/)) {
      const t = line.trim(); if (!t) continue;
      const hm = t.match(/([\d][\d.,]*)\s*(hrs?|hours?|h)\b/i);
      if (hm && (/played|record|playtime/i.test(t) || /^[\d.,]+\s*(hrs?|hours?|h)\b/i.test(t))) { if (last && last.hours == null) last.hours = parseFloat(hm[1].replace(",", "")); continue; }
      const csv = t.match(/^(.+?)\s*[,;\t|]\s*([\d.]+)\s*(hrs?|hours?|h)?\s*$/i);
      if (csv && !/^\d+$/.test(csv[1])) { push(csv[1].replace(/^"|"$/g, ""), parseFloat(csv[2])); last = null; continue; }
      if (JUNK.test(t) || /^[\d\s.,:/-]+$/.test(t)) continue;
      push(t); last = out[out.length - 1];
    }
    return dedupe(out);
  }
  function dedupe(list){ const seen = new Set(); return list.filter(x => { const k = norm(x.name); if (!k || seen.has(k)) return false; seen.add(k); return true; }); }

    if (e.target.closest("[data-manual]")) return openEditor({ title: lastQuery }, true);
    const qa = e.target.closest("[data-qadd]");
    if (qa) {
      const r = lastResults[+qa.dataset.qadd], st = qa.dataset.qs;
      saveGame({ ...r, id: newId(), status: st, rating: 0, hours: "", progress: st === "finished" ? 100 : 0, started: st === "playing" ? todayISO() : "", finished: "", notes: "", sessions: [], cover: "", platform: (r.platforms || []).length === 1 ? r.platforms[0] : "", added: new Date().toISOString(), lookedUp: true, artChecked: true },
        st === "finished" ? `Added ${r.title} as played. Tap the stars to rate it.` : `Added ${r.title} to ${STATUS[st]}`);
      return;
    }
    const qr = e.target.closest("[data-qrate]");
    if (qr) { const g = games.find(x => x.id === qr.dataset.qrate); if (g) { const v = +qr.dataset.v; saveGame({ ...g, rating: g.rating === v ? 0 : v }); } return; }
    const add = e.target.closest("[data-add]"); if (add) return openEditor({ ...lastResults[+add.dataset.add], lookedUp: true, artChecked: true }, true);
    const op = e.target.closest("[data-open]"); if (op) openById(op.dataset.open);
  });
  for (const sel of ["#deck", ".rack", "#list", "#view-stats", "#view-next"]) $(sel).addEventListener("click", e => {
    const y = e.target.closest("[data-year]"); if (y) { statYear = +y.dataset.year; renderStats(); return; }
    const m = e.target.closest("[data-mode]"); if (m) { nextMode = m.dataset.mode; renderNext(); return; }
    const l = e.target.closest("[data-log]"); if (l) { logSession(l.dataset.log, +l.dataset.h, l); return; }
    const b = e.target.closest("[data-beat]"); if (b) { markBeaten(b.dataset.beat); return; }
    const st = e.target.closest("[data-start]"); if (st) { startPlaying(st.dataset.start); return; }
    if (e.target.closest("[data-steam]")) return openImport();
    if (e.target.closest("[data-restore]")) return $("#restore-file").click();
    if (e.target.closest("[data-focus-search]")) { $("#q").focus(); $("#q").scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" }); return; }
    const s = e.target.closest("[data-open]"); if (s) openById(s.dataset.open);
  });
  for (const sel of ["#view-stats"]) {
    $(sel).addEventListener("mousemove", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(e, t.dataset.tip); else if (tipEl) tipEl.hidden = true; });
    $(sel).addEventListener("mouseleave", () => { if (tipEl) tipEl.hidden = true; });
  }
  $("#tools").addEventListener("click", e => { if (e.target.id === "fill-btn") fillDetails(e.target); });
  $("#tools").addEventListener("input", e => { if (e.target.id === "libq") { libQ = e.target.value; renderLibrary(); } });
  $("#filter").addEventListener("click", e => { const f = e.target.closest("[data-filter]"); if (f) { filter = f.dataset.filter; renderLibrary(); } });
  $("#sort").addEventListener("change", e => { sortBy = e.target.value; renderLibrary(); });
  for (const k of ["library","stats","next"]) $("#tab-" + k).addEventListener("click", () => showTab(k));
  // another tab of this app changed the library
  addEventListener("storage", e => { if (e.key === LS) { games = lsGet(LS, []); deleted = lsGet(LS_DEL, {}); render(); } });

  const hashTab = location.hash.slice(1); if (["stats","next"].includes(hashTab)) showTab(hashTab);
  renderResults("idle");
  render();
  sync.paint();
  startSparks();
  addEventListener("load", () => { sync.connect(); });
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
